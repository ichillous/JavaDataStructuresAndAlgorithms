# Canonical examples for scripts/visuals/heap_range_figures.py, checked by
# VisualExamplesHeapRangeTest. Every key starts with "heap_range.".

# heap-sift-paths: a min heap of six values; add(7) sifts up one slot, then remove() sifts the
# displaced last value down two slots. The arrays are the conceptual array of the documented
# sift rules; the Java test recomputes them with an independent array model and checks the
# observable results (peek and removal order) against BinaryMinHeap.
heap_range.sift.base=1,3,8,4,5,9
heap_range.sift.insert=7
heap_range.sift.afterInsert=1,3,7,4,5,9,8
heap_range.sift.insertPath=6,2
heap_range.sift.removed=1
heap_range.sift.afterRemove=3,4,7,8,5,9
heap_range.sift.removePath=0,1,3
heap_range.sift.removalOrderAfterInsert=1,3,4,5,7,8,9
heap_range.sift.removalOrderAfterRemove=3,4,5,7,8,9

# bounded-heap-topk: Selection.smallestK over a stream with k = 3 and natural order.
# keptAfter lists the kept values after each arrival, smallest first; actions are fill,
# replace:<evicted value> or drop.
heap_range.topk.k=3
heap_range.topk.stream=8,3,9,5,2,5,1
heap_range.topk.actions=fill,fill,fill,replace:9,replace:8,drop,replace:5
heap_range.topk.keptAfter=8|3,8|3,8,9|3,5,8|2,3,5|2,3,5|1,2,3
heap_range.topk.result=1,2,3

# trie-prefix-walk: Trie.wordsWithPrefix("ca", 3) over six words.
heap_range.trie.words=car,card,care,cart,cat,dog
heap_range.trie.prefix=ca
heap_range.trie.limit=3
heap_range.trie.result=car,card,care
heap_range.trie.unlimited=car,card,care,cart,cat

# sparse-table-overlap: SparseTable.rangeMin(1, 7) uses two blocks of length 4.
heap_range.sparse.values=5,2,6,4,7,3,8,1
heap_range.sparse.from=1
heap_range.sparse.to=7
heap_range.sparse.level=2
heap_range.sparse.row=2,2,3,3,1
heap_range.sparse.firstBlock=1,5
heap_range.sparse.secondBlock=3,7
heap_range.sparse.answer=2
heap_range.sparse.trueSum=30
heap_range.sparse.blockSums=19,22

# lazy-propagation: LazySegmentTree over 1,2,3,4; rangeAdd(2, 4, 5) stops at node [2,4) and
# leaves a pending +5; rangeSum(3, 4) then reads leaf [3,4) through it.
heap_range.lazy.values=1,2,3,4
heap_range.lazy.addFrom=2
heap_range.lazy.addTo=4
heap_range.lazy.delta=5
heap_range.lazy.sumsBefore=10,3,7
heap_range.lazy.sumsAfter=20,3,17
heap_range.lazy.trueValues=1,2,8,9
heap_range.lazy.queryFrom=3
heap_range.lazy.queryTo=4
heap_range.lazy.queryStored=4
heap_range.lazy.queryAnswer=9

# union-find-compression: UnionFind(9). The first six unions build two trees (roots 0 and 4,
# sizes 5 and 4); union(0, 5) hangs the smaller root 4 below 0; find(7) then flattens 7 and 6.
heap_range.uf.size=9
heap_range.uf.unions=0:1,2:3,0:2,0:8,4:5,6:7,4:6
heap_range.uf.mergeFirst=0
heap_range.uf.mergeSecond=5
heap_range.uf.rootSizes=5,4
heap_range.uf.findElement=7
heap_range.uf.pathBefore=7,6,4,0
heap_range.uf.parentsBefore=0,0,0,2,0,4,4,6,0
heap_range.uf.parentsAfter=0,0,0,2,0,4,0,0,0
heap_range.uf.components=1
heap_range.uf.componentSize=9
