# Canonical examples for scripts/visuals/sorting_figures.py, checked by
# VisualExamplesSortingTest. Every key starts with "sorting.".

# insertion-sort-shift: insertion step for index 4 of the array. The first four values are
# already sorted; the key 4 is saved, 5, 8 and 9 shift right, and the key lands at index 1.
sorting.insertion.values=3,5,8,9,4,1
sorting.insertion.index=4
sorting.insertion.key=4
sorting.insertion.shifted=5,8,9
sorting.insertion.destination=1
sorting.insertion.after=3,4,5,8,9,1

# heapsort-phases: the documented states of heapSort. "built" is the max-heap after the
# bottom-up build; afterOne and afterTwo follow the first and second extraction.
sorting.heap.input=3,1,6,5,2,4
sorting.heap.built=6,5,4,1,2,3
sorting.heap.afterOne=5,3,4,1,2,6
sorting.heap.afterTwo=4,3,2,1,5,6
sorting.heap.sorted=1,2,3,4,5,6

# counting-sort-counts: countingSort tallies each value, then writes each value back count times.
sorting.counting.input=5,3,6,3,4,6
sorting.counting.min=3
sorting.counting.max=6
sorting.counting.range=4
sorting.counting.counts=2,1,1,2
sorting.counting.sorted=3,3,4,5,6,6

# radix-lsd-passes: the idea of radixSort in base 10 (the library uses four 8-bit passes).
sorting.radix.input=35,21,41,15,31,25
sorting.radix.onesDigits=5,1,1,5,1,5
sorting.radix.afterOnes=21,41,31,35,15,25
sorting.radix.tensDigits=2,4,3,3,1,2
sorting.radix.afterTens=15,21,25,31,35,41

# sort-stability: records written key then tag. The hypothetical outcome is a sorted permutation
# that reorders equal keys; no library method is claimed to produce it.
sorting.stability.records=3a,1b,3c,2d,1e,3f
sorting.stability.stable=1b,1e,2d,3a,3c,3f
sorting.stability.hypothetical=1e,1b,2d,3c,3a,3f
