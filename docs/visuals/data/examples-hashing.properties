# Canonical examples for scripts/visuals/hashing_figures.py, checked by
# VisualExamplesHashingTest. Every key starts with "hashing.".
# Slot positions inside OpenAddressingHashMap, BloomFilter and CountMinSketch are private; the
# figures draw conceptual tables from the hashing rule in each class's Javadoc, and the test
# recomputes every value here from that rule and from the real objects. "." marks an empty slot.

# hash-index-spread: OpenAddressingHashMap with 16 slots and Integer keys 65536 and 131072.
# hashCode, then h ^ (h >>> 16), then multiply by 0x9E3779B9 and keep the top 4 bits.
hashing.spread.capacity=16
hashing.spread.slotBits=4
hashing.spread.keys=65536,131072
hashing.spread.hashHex=00010000,00020000
hashing.spread.maskedSlots=0,0
hashing.spread.spreadHex=00010001,00020002
hashing.spread.productHex=17f079b9,2fe0f372
hashing.spread.slots=1,2

# open-addressing-probe: 8 slots; put K, B, G, then L, whose home slot 7 holds G.
hashing.probe.capacity=8
hashing.probe.existing=K,B,G
hashing.probe.existingSlots=2,6,7
hashing.probe.before=.,.,K,.,.,.,B,G
hashing.probe.key=L
hashing.probe.home=7
hashing.probe.path=7,0
hashing.probe.after=L,.,K,.,.,.,B,G
hashing.probe.absent=T
hashing.probe.absentPath=7,0,1

# backward-shift-delete: 8 slots; put C, H, M, B (home slots 3, 3, 4, 6), then remove H.
hashing.shift.capacity=8
hashing.shift.order=C,H,M,B
hashing.shift.homes=3,3,4,6
hashing.shift.before=.,.,.,C,H,M,B,.
hashing.shift.removed=H
hashing.shift.holeSlot=4
hashing.shift.lookup=M
hashing.shift.lookupHome=4
hashing.shift.movedFrom=5
hashing.shift.movedTo=4
hashing.shift.stays=B
hashing.shift.staysSlot=6
hashing.shift.after=.,.,.,C,M,.,B,.

# lfu-buckets: LfuCache(3); put A, B, C; get C; then get B; then put D evicts A.
# Each bucket lists keys from least recently used to most recently used.
hashing.lfu.capacity=3
hashing.lfu.puts=A,B,C
hashing.lfu.firstHit=C
hashing.lfu.start.f1=A,B
hashing.lfu.start.f2=C
hashing.lfu.start.f3=
hashing.lfu.hit=B
hashing.lfu.afterHit.f1=A
hashing.lfu.afterHit.f2=C,B
hashing.lfu.afterHit.f3=
hashing.lfu.insert=D
hashing.lfu.victim=A
hashing.lfu.victimFrequency=1
hashing.lfu.afterInsert.f1=D
hashing.lfu.afterInsert.f2=C,B
hashing.lfu.afterInsert.f3=

# bloom-filter-bits: new BloomFilter<String>(16, 2); add apple and pear; query kiwi and plum.
hashing.bloom.bitCount=16
hashing.bloom.hashCount=2
hashing.bloom.added=apple,pear
hashing.bloom.addedBits0=11,8
hashing.bloom.addedBits1=3,1
hashing.bloom.setBits=1,3,8,11
hashing.bloom.miss=kiwi
hashing.bloom.missBits=8,7
hashing.bloom.falsePositive=plum
hashing.bloom.falsePositiveBits=1,11

# count-min-rows: new CountMinSketch<String>(8, 3); add counts apple 3, pear 1, fig 2, plum 4, kiwi 1.
hashing.cms.width=8
hashing.cms.depth=3
hashing.cms.items=apple,pear,fig,plum,kiwi
hashing.cms.counts=3,1,2,4,1
hashing.cms.total=11
hashing.cms.row0=2,4,2,0,3,0,0,0
hashing.cms.row1=0,0,1,0,4,3,3,0
hashing.cms.row2=3,0,1,2,0,1,0,4
hashing.cms.query=pear
hashing.cms.queryColumns=0,6,2
hashing.cms.queryCounters=2,3,1
hashing.cms.estimate=1
hashing.cms.trueCount=1
