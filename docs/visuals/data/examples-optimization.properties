# Canonical examples for scripts/visuals/optimization_figures.py, checked by
# VisualExamplesOptimizationTest. Every key starts with "optimization.". The figure code
# recomputes each displayed table from the inputs and stops if it disagrees with the
# check cells recorded here; the Java test re-derives the same cells independently.

# lcs-traceback: longestCommonSubsequence("GCTA", "TGCAT"). Cell keys are "row:column".
optimization.lcs.a=GCTA
optimization.lcs.b=TGCAT
optimization.lcs.length=3
optimization.lcs.result=GCT
optimization.lcs.alternative=GCA
optimization.lcs.cornerUp=3
optimization.lcs.cornerLeft=3
optimization.lcs.path=up,take,left,take,take
optimization.lcs.cells=4:5=3,3:5=3,4:4=3,2:4=2,2:3=2,1:2=1,3:1=1

# edit-distance-grid: editScript("brain", "paint"). Steps are "operation:source:target".
optimization.edit.source=brain
optimization.edit.target=paint
optimization.edit.distance=3
optimization.edit.steps=DELETE:0:0,SUBSTITUTE:1:0,MATCH:2:1,MATCH:3:2,MATCH:4:3,INSERT:5:4
optimization.edit.cells=5:5=3,4:3=2,2:1=2,1:0=1,3:2=2

# matrix-chain-splits: matrixChainOrder over A1..A4. Cell keys are "i:j" for the chain Ai..Aj.
optimization.chain.dimensions=30,1,40,10,25
optimization.chain.cost=1400
optimization.chain.parenthesization=(A1((A2A3)A4))
optimization.chain.costs=1:2=1200,2:3=400,3:4=10000,1:3=700,2:4=650,1:4=1400
optimization.chain.splits=1:2=1,2:3=2,3:4=3,1:3=1,2:4=3,1:4=1
optimization.chain.candidates=1=1400,2=41200,3=8200

# held-karp-masks: travelingSalesman over four cities. States are "visitedSet@lastCity=cost",
# the visited set written as the digits of its cities (city 0 is the start and is never in it).
optimization.tsp.distances=0,10,15,20;10,0,35,25;15,35,0,30;20,25,30,0
optimization.tsp.cost=80
optimization.tsp.tour=0,2,3,1
optimization.tsp.alternative=0,1,3,2
optimization.tsp.states=1@1=10,2@2=15,3@3=20,12@1=50,12@2=45,13@1=45,13@3=35,23@2=50,23@3=45,123@1=70,123@2=65,123@3=75
optimization.tsp.closing=80,80,95

# weighted-interval-choice: weightedIntervalScheduling; intervals are "start:end:weight",
# already in sorted-by-end order. "chosen" holds indices into that order.
optimization.interval.intervals=0:3:3,2:5:6,3:7:2,5:8:4
optimization.interval.names=A,B,C,D
optimization.interval.compatible=0,0,1,2
optimization.interval.take=3,6,5,10
optimization.interval.skip=0,3,6,6
optimization.interval.best=3,6,6,10
optimization.interval.chosen=1,3
optimization.interval.total=10

# huffman-tree: huffmanCodeLengths over five symbols.
optimization.huffman.symbols=a,b,c,d,e
optimization.huffman.frequencies=5,9,12,13,16
optimization.huffman.merges=5+9=14,12+13=25,14+16=30,25+30=55
optimization.huffman.lengths=3,3,2,2,2
optimization.huffman.cost=124

# subset-sum-halves: subsetSum over six signed values, halves [0,3) and [3,6).
optimization.subset.values=4,-7,3,9,-2,6
optimization.subset.target=6
optimization.subset.witness=0,1,3
optimization.subset.leftSums=0,4,-7,-3,3,7,-4,0
optimization.subset.rightSums=0,9,-2,7,6,15,4,13
optimization.subset.leftMask=3
optimization.subset.rightMask=1
optimization.subset.duplicateSum=0
