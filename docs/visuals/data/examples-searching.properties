# Canonical examples for scripts/visuals/searching_figures.py, checked by
# VisualExamplesSearchingTest. Every key starts with "searching.".

# linear-scan-first-match: linearSearch over an array with a duplicate, then a miss.
searching.scan.values=9,4,4,2
searching.scan.hitTarget=4
searching.scan.hitIndex=1
searching.scan.hitComparisons=2
searching.scan.missTarget=7
searching.scan.missResult=-1
searching.scan.missComparisons=4

# predicate-boundary: minimum ship capacity for these weights within 3 days (weights in
# order, a day's load is a run of consecutive weights). firstTrue(low, highExclusive, ...).
searching.capacity.weights=3,2,2,4,1,4
searching.capacity.days=3
searching.capacity.low=4
searching.capacity.highExclusive=17
searching.capacity.answer=6
# Days needed by capacities 4, 5, ..., 16 in order.
searching.capacity.daysNeeded=5,4,3,3,3,2,2,2,2,2,2,2,1
# The probes firstTrue makes, as capacity:daysNeeded, in call order.
searching.capacity.probes=10:2,7:3,5:4,6:3

# quickselect-shrink: Selection.kthSmallest, median-of-three pivot, three-way partition.
searching.quick.values=7,2,9,4,4,1
searching.quick.k=2
searching.quick.answer=4
# One entry per round: low:high:pivot:lessEnd:greaterStart (the equal part is lessEnd..greaterStart).
searching.quick.rounds=0:5:7:4:4,0:3:2:1:1,2:3:4:2:3
searching.quick.after1=2,1,4,4,7,9
searching.quick.after2=1,2,4,4,7,9
searching.quick.after3=1,2,4,4,7,9

# kway-merge-heap: Selection.mergeSorted over three sorted lists A, B, C (list indices 0, 1, 2).
searching.merge.list0=1,4,7
searching.merge.list1=2,4
searching.merge.list2=3,6
# Output values and the list each came from, in output order.
searching.merge.output=1,2,3,4,4,6,7
searching.merge.sources=0,1,2,0,1,2,0
# After the first three outputs, the heap holds these heads as value:list, in pop order.
searching.merge.headsAfterThree=4:0,4:1,6:2
