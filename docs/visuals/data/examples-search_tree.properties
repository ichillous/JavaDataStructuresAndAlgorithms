# Canonical examples for scripts/visuals/search_tree_figures.py, checked by
# VisualExamplesSearchTreeTest. Every key starts with "search_tree.".
# A shape string is key(left,right); a missing child is empty, a leaf has no parentheses,
# and red-black shapes append B or R to each key.

# tree-traversals: BinarySearchTree built by adding these keys in order.
search_tree.traversal.insertOrder=8,3,10,1,6,14,4,7
search_tree.traversal.shape=8(3(1,6(4,7)),10(,14))
search_tree.traversal.size=8
search_tree.traversal.height=3
search_tree.traversal.leaves=1,4,7,14
search_tree.traversal.preOrder=8,3,1,6,4,7,10,14
search_tree.traversal.inOrder=1,3,4,6,7,8,10,14
search_tree.traversal.postOrder=1,4,7,6,3,14,10,8
search_tree.traversal.levelOrder=8,3,10,1,6,14,4,7

# bst-delete-successor: remove a key with two children. Three keys remain, so the height
# after the delete (1) forces the shape 3(1,4); replacing with the predecessor would give 2.
search_tree.delete.insertOrder=2,1,4,3
search_tree.delete.before=2(1,4(3,))
search_tree.delete.beforeInOrder=1,2,3,4
search_tree.delete.beforeHeight=2
search_tree.delete.key=2
search_tree.delete.successor=3
search_tree.delete.after=3(1,4)
search_tree.delete.afterInOrder=1,3,4
search_tree.delete.afterHeight=1

# red-black-23-nodes: RedBlackTreeMap after put 1, 2, 3, 4, 5, read as a 2-3 tree.
search_tree.twothree.putOrder=1,2,3,4,5
search_tree.twothree.shape=4B(2R(1B,3B),5B)
search_tree.twothree.height=2
search_tree.twothree.rootNode=2,4
search_tree.twothree.childNodes=1,3,5
search_tree.twothree.twoThreeHeight=1

# red-black-fixups: the three local repairs inside one put, each shown on three keys.
search_tree.fix.rotateLeft.puts=1,2
search_tree.fix.rotateLeft.before=1B(,2R)
search_tree.fix.rotateLeft.after=2B(1R,)
search_tree.fix.rotateRight.puts=3,2,1
search_tree.fix.rotateRight.before=3B(2R(1R,),)
search_tree.fix.rotateRight.after=2B(1R,3R)
search_tree.fix.flip.puts=1,2,3
search_tree.fix.flip.before=2B(1R,3R)
search_tree.fix.flip.after=2R(1B,3B)
search_tree.fix.height=1
