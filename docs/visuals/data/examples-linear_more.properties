# Canonical examples for scripts/visuals/linear_more_figures.py, checked by
# VisualExamplesLinearMoreTest. Every key starts with "linear_more.".

# dynamic-array-growth: new DynamicArray<>(4), append 10, 20, 30, 40, then 50.
linear_more.growth.capacity=4
linear_more.growth.before=10,20,30,40
linear_more.growth.value=50
linear_more.growth.grownCapacity=8
linear_more.growth.after=10,20,30,40,50
linear_more.growth.copies=4
linear_more.growth.nextGrowthAppend=9
linear_more.growth.nextCopies=8
linear_more.growth.totalCopies=12

# singly-insert-after: insert 15 after the node holding 10 in the chain 10 -> 20 -> 30.
# The right order writes new.next = pred.next first, then pred.next = new. The wrong order
# writes pred.next = new first, so new.next = pred.next reads the new node itself.
linear_more.insert.before=10,20,30
linear_more.insert.predecessorIndex=0
linear_more.insert.value=15
linear_more.insert.result=10,15,20,30
linear_more.insert.wrongReachable=10,15
linear_more.insert.wrongLost=20,30

# stack-bracket-matching: ArrayStack<Character>. "-" means the stack is empty. Stacks are
# written bottom to top, one entry per character read.
linear_more.brackets.balanced={[()]}
linear_more.brackets.balancedStacks={,{[,{[(,{[,{,-
linear_more.brackets.unbalanced=([)]
linear_more.brackets.unbalancedStacks=(,([
linear_more.brackets.mismatchAt=2
linear_more.brackets.mismatchTop=[

# deque-both-ends: new RingDeque<>(4). Slots hold the physical contents; "." is an empty slot.
# Step 1: addLast(20), addLast(30). Step 2: addFirst(10). Step 3: addLast(40).
# Step 4: removeLast() returns 40, then removeFirst() returns 10.
linear_more.deque.capacity=4
linear_more.deque.step1.slots=20,30,.,.
linear_more.deque.step1.head=0
linear_more.deque.step1.tail=1
linear_more.deque.step1.order=20,30
linear_more.deque.step2.slots=20,30,.,10
linear_more.deque.step2.head=3
linear_more.deque.step2.tail=1
linear_more.deque.step2.order=10,20,30
linear_more.deque.step3.slots=20,30,40,10
linear_more.deque.step3.head=3
linear_more.deque.step3.tail=2
linear_more.deque.step3.order=10,20,30,40
linear_more.deque.step4.slots=20,30,.,.
linear_more.deque.step4.head=0
linear_more.deque.step4.tail=1
linear_more.deque.step4.order=20,30
linear_more.deque.step4.removedLast=40
linear_more.deque.step4.removedFirst=10

# array-vs-list-access: eight values; get(5) in a DynamicArray and a DoublyLinkedList.
# hops[i] is the number of links followed from the nearer end to reach index i.
linear_more.access.values=10,20,30,40,50,60,70,80
linear_more.access.index=5
linear_more.access.value=60
linear_more.access.hops=0,1,2,3,3,2,1,0
linear_more.access.fromTail=4,5,6,7
