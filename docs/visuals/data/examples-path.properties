# zero-one-bfs-deque: WeightedGraph.directed(4) with these edges (from:to:weight), source 0.
path.zob.vertices=4
path.zob.edges=0:1:1,0:2:0,2:3:0,3:1:0
path.zob.source=0
path.zob.deque.start=0
path.zob.deque.pop0=2,1
