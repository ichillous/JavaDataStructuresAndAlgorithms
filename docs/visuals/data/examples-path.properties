path.zob.deque.pop3=1,1
path.zob.deque.pop1=1
path.zob.front.pop0=2
path.zob.back.pop0=1
path.zob.front.pop2=3
path.zob.back.pop2=
path.zob.front.pop3=1
path.zob.back.pop3=
path.zob.front.pop1=
path.zob.back.pop1=
