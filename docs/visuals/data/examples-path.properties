path.zob.path=0,2,3,1

# astar-heuristic: WeightedGraph.undirected(25), a 5x5 grid of unit edges, cell = row * 5 + column.
# hSeen lists the cells the heuristic function was called for, with h = Manhattan distance;
# zeroSeen counts the cells it was called for when h is always 0 (Dijkstra-style ordering).
path.astar.rows=5
path.astar.columns=5
path.astar.source=10
path.astar.target=14
path.astar.route=10,11,12,13,14
path.astar.distance=4
path.astar.g=0,1,2,3,4
path.astar.h=4,3,2,1,0
path.astar.f=4,4,4,4,4
path.astar.hSeen=5,6,7,8,10,11,12,13,14,15,16,17,18
path.astar.zeroSeen=21

# floyd-warshall-via: WeightedGraph.directed(4). Matrices are row-major, INF means unreachable.
# before = shortest walks using intermediates {0}; after = intermediates {0, 1} (k = 1).
path.fw.vertices=4
path.fw.edges=0:1:3,1:2:2,0:2:9,2:3:1
path.fw.k=1
path.fw.from=0
path.fw.to=2
path.fw.before=0,3,9,INF,INF,0,2,INF,INF,INF,0,1,INF,INF,INF,0
path.fw.after=0,3,5,INF,INF,0,2,INF,INF,INF,0,1,INF,INF,INF,0
path.fw.oldValue=9
path.fw.newValue=5
path.fw.final=0,3,5,6,INF,0,2,3,INF,INF,0,1,INF,INF,INF,0
