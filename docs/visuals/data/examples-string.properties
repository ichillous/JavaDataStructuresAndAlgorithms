# Canonical examples for scripts/visuals/string_figures.py, checked by
# VisualExamplesStringTest. Every key starts with "string.".

# z-box: zFunction("aabxaabxaab"). The box found at index 4 is [4, 11) because z[4] = 7.
string.z.text=aabxaabxaab
string.z.array=11,1,0,0,7,1,0,0,3,1,0
string.z.boxStart=4
string.z.boxEnd=11
# Index 5 reads z[1] = 1, which fits inside the box, so z[5] = 1.
string.z.copyIndex=5
string.z.copyMirror=1
string.z.copyValue=1
# Index 8 reads z[4] = 7, which does not fit (3 units remain), so it starts at 3.
string.z.capIndex=8
string.z.capMirror=4
string.z.capMirrorValue=7
string.z.capValue=3

# rabin-karp-rolling: the text holds an impostor (same hash, different units) and the real match.
# Hash = sum(unit * 257^(p-1-j)) mod (2^31 - 1).
string.rk.base=257
string.rk.modulus=2147483647
string.rk.text=aeaecbagab
string.rk.pattern=bagab
string.rk.patternHash=1826217140
string.rk.windowHashes=1826217140,2028594877,1826348465,2062345407,1910300087,1826217140
string.rk.impostorStart=0
string.rk.matchStart=5
# The impostor window differs from the pattern at unit 0 ('a' against 'b').
string.rk.mismatchUnit=0

# manacher-mirror: longestPalindromicSubstring("cabacabad") is [1, 8) = "abacaba".
# odd radius r at center i means text[i - r + 1 .. i + r - 1] is the longest odd palindrome there.
string.man.text=cabacabad
string.man.radii=1,1,3,1,4,1,2,1,1
string.man.center=4
string.man.left=1
string.man.right=7
string.man.longestStart=1
string.man.longestEnd=8
# Index 5 mirrors index 3 (left + right - 5), whose radius 1 fits inside the palindrome.
string.man.fitIndex=5
string.man.fitMirror=3
# Index 6 mirrors index 2, whose radius 3 does not fit: only 2 units remain up to right.
string.man.capIndex=6
string.man.capMirror=2
string.man.capMirrorRadius=3
string.man.capStart=2

# aho-corasick-links: patterns he, she, his, hers searched in "ushers".
# nodes are the trie prefixes below the root; failure lists the links that do not go to the root.
string.ac.patterns=he,she,his,hers
string.ac.text=ushers
string.ac.nodes=h,he,her,hers,hi,his,s,sh,she
string.ac.failure=sh>h,she>he,his>s,hers>s
# Longest trie prefix that ends at each text position, from the standard construction.
string.ac.kept=root,s,sh,she,her,hers
string.ac.matches=1:she,2:he,2:hers

# suffix-array-lcp: SuffixArray("banana") and the range for the pattern "ana".
string.sa.text=banana
string.sa.suffixes=5,3,1,0,4,2
string.sa.lcp=0,1,3,0,0,2
string.sa.pattern=ana
string.sa.low=1
string.sa.high=3
string.sa.occurrences=1,3
