# Canonical examples for the interactive step-throughs built by scripts/visuals/trace_data.py,
# checked against the public API by VisualExamplesTracesTest. Every key starts with "traces.".

# insertion: SortAlgorithms.insertionSort; equal values keep their order (stable).
traces.insertion.values=4,3,5,3,1
traces.insertion.sorted=1,3,3,4,5

# quickselect: Selection.kthSmallest with a zero-based rank. The trace uses the same
# median-of-three pivot and three-way partition; the library's
# median-of-medians fallback never triggers on this input.
traces.quickselect.values=7,2,9,4,1,8,5
traces.quickselect.k=1
traces.quickselect.answer=2

# radix: SortAlgorithms.radixSort. The trace uses three decimal digits for readability; the
# library sorts by four 8-bit digits. Both are stable least-significant-digit passes.
traces.radix.values=329,457,657,839,436,720,355
traces.radix.sorted=329,355,436,457,657,720,839

# two-pointers: ArrayPatterns.pairWithSum on an ascending array; result is first:second indices.
traces.two.values=1,3,4,6,8,11,15
traces.two.target=17
traces.two.result=3:5

# window: ArrayPatterns.longestSubstringWithoutRepeats; result is start:end (half-open).
traces.window.text=pwwkew
traces.window.result=2:5

# z-function: StringAlgorithms.zFunction; z[0] is the text length by the documented convention.
traces.z.text=aabxaab
traces.z.result=7,1,0,0,3,1,0

# dfs: GraphAlgorithms.depthFirst on an undirected graph, edges added in this order.
traces.dfs.vertices=6
traces.dfs.edges=0:1,0:2,1:3,2:4,3:4
traces.dfs.order=0,1,3,4,2

# topological: GraphAlgorithms.topologicalSort (Kahn) on a directed acyclic graph.
traces.topo.vertices=6
traces.topo.edges=0:1,2:1,1:3,2:4,3:5,4:5
traces.topo.order=0,2,1,4,3,5
