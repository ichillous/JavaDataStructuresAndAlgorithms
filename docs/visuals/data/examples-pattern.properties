# Canonical examples for scripts/visuals/pattern_figures.py, checked by
# VisualExamplesPatternTest. Every key starts with "pattern.".
# Intermediate states (pointers, windows, stacks) are private to the library: the Java test
# re-derives each one by following the documented invariant and asserts it equals these.

# two-pointers-pair-sum: ArrayPatterns.pairWithSum([1, 2, 3, 4, 6], 6) -> IndexPair(1, 3).
pattern.pair.values=1,2,3,4,6
pattern.pair.target=6
pattern.pair.lefts=0,0,1
pattern.pair.rights=4,3,3
pattern.pair.sums=7,5,6
pattern.pair.first=1
pattern.pair.second=3

# sliding-window-distinct: longestSubstringWithoutRepeats("abcbad") -> Span(2, 6).
# Shown after reading index i; previous is the earlier index of that unit, or -1.
pattern.window.text=abcbad
pattern.window.shown=2,3,4,5
pattern.window.previous=-1,1,0,-1
pattern.window.starts=0,2,2,2
pattern.window.bests=3,3,3,4
pattern.window.spanStart=2
pattern.window.spanEnd=6

# monotonic-stack-next-greater: nextGreaterIndices([2, 1, 2, 4, 3]). Stacks hold indices.
pattern.stack.values=2,1,2,4,3
pattern.stack.pops0=
pattern.stack.pops1=
pattern.stack.pops2=1
pattern.stack.pops3=2,0
pattern.stack.pops4=
pattern.stack.after0=0
pattern.stack.after1=0,1
pattern.stack.after2=0,2
pattern.stack.after3=3
pattern.stack.after4=3,4
pattern.stack.result=3,2,3,-1,-1

# difference-array-ranges: applyRangeAdds(new long[5], +3 on [1, 4) then +2 on [0, 2)).
# Update triples are from,to,delta. The difference array has length + 1 entries.
pattern.diff.length=5
pattern.diff.first=1,4,3
pattern.diff.second=0,2,2
pattern.diff.afterFirst=0,3,0,0,-3,0
pattern.diff.afterSecond=2,3,-2,0,-3,0
pattern.diff.result=2,5,3,3,0

# interval-sweep-rooms: minimumMeetingRooms of [1,4), [2,5), [5,7), [6,8); [2,5) and [5,7) touch.
# Events are S<time> for a start and E<time> for an end, ends first at equal times.
pattern.sweep.starts=1,2,5,6
pattern.sweep.ends=4,5,7,8
pattern.sweep.events=S1,S2,E4,E5,S5,S6,E7,E8
pattern.sweep.depths=1,2,1,0,1,2,1,0
pattern.sweep.rooms=2

# inversion-count-merge: countInversions([2, 4, 1, 3, 5]) splits into the halves below.
# adds is what the library adds as each value is emitted in merge order.
pattern.inversion.left=2,4
pattern.inversion.right=1,3,5
pattern.inversion.emitted=1,2,3,4,5
pattern.inversion.adds=2,0,1,0,0
pattern.inversion.total=3
