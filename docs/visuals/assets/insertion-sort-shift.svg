<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 877" width="520" height="877" role="img" aria-labelledby="title desc">
<title id="title">28  One insertion step</title>
<desc id="desc">In 3, 5, 8, 9, 4, 1 the prefix 3, 5, 8, 9 is sorted. The key 4 is saved, the three larger values 5, 8 and 9 shift one slot right, and 4 drops into index 1.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
