<text x="44" y="721" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="750" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Insertion sort shifts only the larger</text>
