<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img" aria-labelledby="title desc">
<title id="title">55  modPow by repeated squaring</title>
<desc id="desc">NumberTheory.modPow(3, 13, 1000) reads the bits of 13 = 1101 from the lowest: the squares of 3 are 3, 9, 81 and 561 modulo 1000, and the result 3, 3, 243, 323 changes only on the 1 bits, ending at 323.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="modpow-squares-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="modpow-squares-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="modpow-squares-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="modpow-squares-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="modpow-squares-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="modpow-squares-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="modpow-squares-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="modpow-squares-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="modpow-squares-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="modpow-squares-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="modpow-squares-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="modpow-squares-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="modpow-squares-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="modpow-squares-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="modpow-squares-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="860" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">55  modPow by repeated squaring</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Math and bits · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">13 is 1101 in binary</text>
<rect x="61" y="178" width="60" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="91.0" y="209.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">1</text>
<text x="91.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">bit 0</text>
<rect x="131" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="161.0" y="209.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<text x="161.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">bit 1</text>
<rect x="201" y="178" width="60" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="231.0" y="209.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">1</text>
<text x="231.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">bit 2</text>
<rect x="271" y="178" width="60" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="301.0" y="209.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">1</text>
<text x="301.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">bit 3</text>
<text x="61" y="284" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">13 = 1 + 4 + 8</text>
<circle cx="42" cy="321" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="327" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="328" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Square 3 each step, multiply on 1 bits</text>
<text x="200.0" y="370" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">bit</text>
<text x="300.0" y="370" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3^(2^i)</text>
<text x="400.0" y="370" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">result</text>
<text x="138" y="406.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">bit 0</text>
<rect x="150" y="382" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="200.0" y="407.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">1</text>
<rect x="250" y="382" width="100" height="36" rx="3" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="300.0" y="407.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">3</text>
<rect x="350" y="382" width="100" height="36" rx="3" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="400.0" y="407.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">3</text>
<text x="138" y="442.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">bit 1</text>
<rect x="150" y="418" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="200.0" y="443.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<rect x="250" y="418" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="300.0" y="443.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">9</text>
<rect x="350" y="418" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="400.0" y="443.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<text x="138" y="478.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">bit 2</text>
<rect x="150" y="454" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="200.0" y="479.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">1</text>
<rect x="250" y="454" width="100" height="36" rx="3" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="300.0" y="479.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">81</text>
<rect x="350" y="454" width="100" height="36" rx="3" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="400.0" y="479.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">243</text>
<text x="138" y="514.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">bit 3</text>
<rect x="150" y="490" width="100" height="36" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="200.0" y="515.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">1</text>
<rect x="250" y="490" width="100" height="36" rx="3" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="300.0" y="515.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">561</text>
<rect x="350" y="490" width="100" height="36" rx="3" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="400.0" y="515.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">323</text>
<circle cx="42" cy="551" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="557" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="558" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">3^13 mod 1000 = 323</text>
<rect x="61" y="584" width="224" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="173.0" y="605" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">3 × 81 × 561 = 136323</text>
<rect x="28" y="628" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="644" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">square multiplied in</text>
<rect x="260.256" y="628" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="294.256" y="644" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">result updated</text>
<rect x="28" y="660" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="62" y="676" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">bit 0: skipped</text>
<rect x="28" y="700" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="731" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="760" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Square the base once per exponent bit</text>
<text x="44" y="787" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">and multiply it in only for 1 bits:</text>
<text x="44" y="814" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">O(log e) steps.</text>
</svg>
