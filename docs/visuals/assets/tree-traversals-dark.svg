<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 890" width="520" height="890" role="img" aria-labelledby="title desc">
<title id="title">28  Four ways to walk a tree</title>
<desc id="desc">A binary search tree built from 8, 3, 10, 1, 6, 14, 4 and 7 has root 8, leaves 1, 4, 7 and 14, and height 3. Pre-order reads 8 3 1 6 4 7 10 14, in-order reads the keys sorted, post-order ends at the root 8, and level order reads one depth at a time.</desc>
