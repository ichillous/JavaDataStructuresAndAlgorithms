<text x="232.0" y="612" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="263" y="538" width="50" height="48" rx="8" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
