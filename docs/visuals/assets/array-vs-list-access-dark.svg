<text x="28" y="640" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">At most 3 hops for 8 nodes; an array needs 1 jump.</text>
<rect x="28" y="660" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="676" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">index 5</text>
<rect x="148.8" y="660" width="26" height="20" rx="4" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
<text x="182.8" y="676" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">reached from the tail</text>
<rect x="28" y="692" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="708" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">reached from the head</text>
<rect x="28" y="732" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="763" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="792" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">An array reaches any index in one jump;</text>
<text x="44" y="819" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">a list walks links from the nearer end.</text>
</svg>
