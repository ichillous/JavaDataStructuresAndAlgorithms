<path d="M 344.0 378 Q 344.0 370 352.0 370 H 392.0 Q 400.0 370 400.0 362 Q 400.0 370 408.0 370 H 448.0 Q 456.0 370 456.0 378" fill="none" stroke="#cdb6ff" stroke-width="2"/>
<text x="400.0" y="354" font-size="18" fill="#cdb6ff" text-anchor="middle" font-weight="700">2 hops</text>
<text x="28" y="482" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">5 is not below 8/2, so the walk starts at the tail.</text>
<circle cx="42" cy="509" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="515" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="516" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Links followed from the nearer end</text>
<rect x="39" y="538" width="50" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="64.0" y="569.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">0</text>
<text x="64.0" y="612" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="95" y="538" width="50" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="120.0" y="569.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">1</text>
<text x="120.0" y="612" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
