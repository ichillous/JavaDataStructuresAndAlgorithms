<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 870" width="520" height="870" role="img" aria-labelledby="title desc">
<title id="title">92  Rabin-Karp: hash, then verify</title>
<desc id="desc">Searching aeaecbagab for bagab slides a five-unit window; windows 0 and 5 have the pattern&#x27;s hash, window 0 (aeaec) is rejected at unit 0 and window 5 is reported.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="rabin-karp-rolling-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="rabin-karp-rolling-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="rabin-karp-rolling-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="rabin-karp-rolling-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="rabin-karp-rolling-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="rabin-karp-rolling-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="rabin-karp-rolling-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="rabin-karp-rolling-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="rabin-karp-rolling-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="rabin-karp-rolling-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="rabin-karp-rolling-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="rabin-karp-rolling-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="rabin-karp-rolling-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="rabin-karp-rolling-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="rabin-karp-rolling-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="870" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">92  Rabin-Karp: hash, then verify</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Strings · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Slide a 5-unit window over aeaecbagab</text>
<text x="28" y="186" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">pattern bagab, hash 1826217140</text>
<text x="28" y="214" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">hash = sum(unit * 257^(p-1-j)) mod 2147483647</text>
<text x="36" y="252" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">start</text>
<text x="96" y="252" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">window</text>
<text x="192" y="252" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">hash</text>
<text x="340" y="252" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">vs pattern hash</text>
<rect x="28" y="264" width="464" height="34" rx="6" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="288" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">0</text>
<text x="96" y="288" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">aeaec</text>
<text x="192" y="288" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">1826217140</text>
<text x="340" y="288" font-size="20" fill="#f4cf70" text-anchor="start" font-weight="700">equal</text>
<rect x="28" y="302" width="464" height="34" rx="6" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="44" y="326" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">1</text>
<text x="96" y="326" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">eaecb</text>
<text x="192" y="326" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">2028594877</text>
<text x="340" y="326" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">differs</text>
<rect x="28" y="340" width="464" height="34" rx="6" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="44" y="364" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">2</text>
<text x="96" y="364" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">aecba</text>
<text x="192" y="364" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">1826348465</text>
<text x="340" y="364" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">differs</text>
<rect x="28" y="378" width="464" height="34" rx="6" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="44" y="402" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">3</text>
<text x="96" y="402" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">ecbag</text>
<text x="192" y="402" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">2062345407</text>
<text x="340" y="402" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">differs</text>
<rect x="28" y="416" width="464" height="34" rx="6" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="44" y="440" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">4</text>
<text x="96" y="440" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">cbaga</text>
<text x="192" y="440" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">1910300087</text>
<text x="340" y="440" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">differs</text>
<rect x="28" y="454" width="464" height="34" rx="6" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="478" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">5</text>
<text x="96" y="478" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">bagab</text>
<text x="192" y="478" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">1826217140</text>
<text x="340" y="478" font-size="20" fill="#f4cf70" text-anchor="start" font-weight="700">equal</text>
<text x="28" y="516" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">Slide 0 to 1: drop a (97), add b (98) in O(1):</text>
<text x="28" y="542" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">H1 = (H0 - 97*257^4)*257 + 98 mod M</text>
<circle cx="42" cy="577" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="583" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="584" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Compare the units of each hit</text>
<rect x="28" y="602" width="95" height="30" rx="15" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="75.5" y="623" font-size="18" fill="#ffaaa1" text-anchor="middle" font-weight="700">reject 0</text>
<text x="133" y="623" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">aeaec has unit 0 a, not b</text>
<rect x="28" y="646" width="98" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="77.0" y="667" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">report 5</text>
<text x="136" y="667" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">bagab equals the pattern</text>
<rect x="28" y="696" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="62" y="712" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">hash equals</text>
<rect x="191.13600000000002" y="696" width="26" height="20" rx="4" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="225.13600000000002" y="712" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">rejected</text>
<rect x="319.71200000000005" y="696" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="353.71200000000005" y="712" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">confirmed</text>
<rect x="28" y="736" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="767" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="796" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Hash hits only choose where to compare;</text>
<text x="44" y="823" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">verification rejects impostors.</text>
</svg>
