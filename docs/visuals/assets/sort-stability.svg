<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 863" width="520" height="863" role="img" aria-labelledby="title desc">
<title id="title">54  Stable and unstable outcomes</title>
<desc id="desc">Records 3a, 1b, 3c, 2d, 1e, 3f sorted by their number: a stable sort gives 1b, 1e, 2d, 3a, 3c, 3f, keeping tags in order, while a hypothetical unstable outcome 1e, 1b, 2d, 3c, 3a, 3f reorders equal keys.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="sort-stability-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="sort-stability-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="sort-stability-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="sort-stability-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="sort-stability-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="sort-stability-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="sort-stability-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="sort-stability-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="sort-stability-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="sort-stability-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker><marker id="sort-stability-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1c6b3c"/></marker><marker id="sort-stability-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#e3f4e8"/></marker><marker id="sort-stability-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b3fb8"/></marker><marker id="sort-stability-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f0eafb"/></marker><marker id="sort-stability-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fde9e7"/></marker></defs>
<rect x="0" y="0" width="520" height="863" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">54  Stable and unstable outcomes</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Sorting and searching · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Input: key, then tag (arrival order)</text>
<rect x="39" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="67.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3a</text>
<rect x="103" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="131.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1b</text>
<rect x="167" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="195.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3c</text>
<rect x="231" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="259.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2d</text>
<rect x="295" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="323.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1e</text>
<rect x="359" y="182" width="56" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="387.0" y="213.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3f</text>
<circle cx="42" cy="267" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="273" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="274" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Stable: mergeSort(T[], Comparator)</text>
<rect x="39" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="67.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">1b</text>
<rect x="103" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="131.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">1e</text>
<rect x="167" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="195.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">2d</text>
<rect x="231" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="259.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">3a</text>
<rect x="295" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="323.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">3c</text>
<rect x="359" y="300" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="387.0" y="331.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">3f</text>
<text x="39" y="376" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">equal keys keep their tag order</text>
<circle cx="42" cy="415" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="421" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="422" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">One unstable outcome (hypothetical)</text>
<rect x="39" y="448" width="56" height="48" rx="8" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="67.0" y="479.0" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">1e</text>
<rect x="103" y="448" width="56" height="48" rx="8" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="131.0" y="479.0" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">1b</text>
<rect x="167" y="448" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="195.0" y="479.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">2d</text>
<rect x="231" y="448" width="56" height="48" rx="8" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="259.0" y="479.0" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">3c</text>
<rect x="295" y="448" width="56" height="48" rx="8" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="323.0" y="479.0" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">3a</text>
<rect x="359" y="448" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="387.0" y="479.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">3f</text>
<text x="39" y="524" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">sorted by key, tags reordered</text>
<text x="39" y="554" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">int[] quickSort and heapSort promise</text>
<text x="39" y="578" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">no stability: equal keys may reorder.</text>
<rect x="28" y="604" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="620" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">equal keys in input order</text>
<rect x="28" y="636" width="26" height="20" rx="4" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="62" y="652" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">equal keys reordered</text>
<rect x="28" y="676" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="707" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="736" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A stable sort keeps equal keys in their</text>
<text x="44" y="763" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">input order; an unstable sort may</text>
<text x="44" y="790" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">reorder them, losing any earlier</text>
<text x="44" y="817" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">ordering by tag.</text>
</svg>
