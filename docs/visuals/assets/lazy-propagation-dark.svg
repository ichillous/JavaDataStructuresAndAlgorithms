<text x="120" y="283" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="88" y="282" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">[0,2)</text>
<circle cx="320" cy="276" r="24" fill="#302a18" stroke="#f4cf70" stroke-width="3"/>
<text x="320" y="283" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">17</text>
<text x="288" y="282" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">[2,4)</text>
<circle cx="70" cy="338" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="70" y="345" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">1</text>
<circle cx="170" cy="338" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="170" y="345" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">2</text>
<circle cx="270" cy="338" r="24" fill="#111827" stroke="#8291aa" stroke-width="3" stroke-dasharray="6 5"/>
<text x="270" y="345" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="700">3</text>
<circle cx="370" cy="338" r="24" fill="#111827" stroke="#8291aa" stroke-width="3" stroke-dasharray="6 5"/>
<text x="370" y="345" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="700">4</text>
<rect x="352" y="261" width="128" height="30" rx="15" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="416.0" y="282" font-size="18" fill="#f4cf70" text-anchor="middle" font-weight="700">pending +5</text>
<text x="28" y="392" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">Leaves below still say 3 and 4; true values are 8 and 9.</text>
<circle cx="42" cy="431" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="437" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="438" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">rangeSum(3, 4) carries +5 down</text>
<line x1="196.2" y1="510.75" x2="143.8" y2="543.25" stroke="#8291aa" stroke-width="2.5"/>
<line x1="243.8" y1="510.75" x2="296.2" y2="543.25" stroke="#9cbcff" stroke-width="2.5"/>
<line x1="102.42" y1="579.8" x2="87.58" y2="598.2" stroke="#8291aa" stroke-width="2.5"/>
<line x1="137.58" y1="579.8" x2="152.42" y2="598.2" stroke="#8291aa" stroke-width="2.5"/>
<line x1="302.42" y1="579.8" x2="287.58" y2="598.2" stroke="#8291aa" stroke-width="2.5"/>
<line x1="337.58" y1="579.8" x2="352.42" y2="598.2" stroke="#9cbcff" stroke-width="2.5"/>
<circle cx="220" cy="496" r="24" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="220" y="503" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">20</text>
<text x="252" y="502" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">[0,4)</text>
<circle cx="120" cy="558" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="120" y="565" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="88" y="564" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">[0,2)</text>
<circle cx="320" cy="558" r="24" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="320" y="565" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">17</text>
<text x="288" y="564" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">[2,4)</text>
<circle cx="70" cy="620" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="70" y="627" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">1</text>
<circle cx="170" cy="620" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="170" y="627" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">2</text>
<circle cx="270" cy="620" r="24" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="270" y="627" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<circle cx="370" cy="620" r="24" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="370" y="627" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<rect x="352" y="543" width="128" height="30" rx="15" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="416.0" y="564" font-size="18" fill="#f4cf70" text-anchor="middle" font-weight="700">pending +5</text>
<text x="28" y="674" font-size="18" fill="#9cbcff" text-anchor="start" font-weight="700">4 stored + 5 pending, 1 element = 9</text>
<rect x="28" y="698" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="62" y="714" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">tagged node</text>
<rect x="193.728" y="698" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="227.728" y="714" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">stale child</text>
<rect x="341.312" y="698" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="375.312" y="714" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">queried</text>
<rect x="28" y="738" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="769" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="798" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">A range add stops at a covering node</text>
<text x="44" y="825" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">and leaves a pending value.</text>
</svg>
