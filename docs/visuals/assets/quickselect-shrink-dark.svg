<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img" aria-labelledby="title desc">
<title id="title">84  Quickselect keeps one part</title>
<desc id="desc">kthSmallest of 7, 2, 9, 4, 4, 1 with k = 2: three partitions with pivots 7, 2 and 4 narrow the range from [0..5] to [0..3] to [2..3], and the equal part answers 4.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="quickselect-shrink-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="quickselect-shrink-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="quickselect-shrink-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="quickselect-shrink-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="quickselect-shrink-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="quickselect-shrink-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="quickselect-shrink-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="quickselect-shrink-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="quickselect-shrink-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="quickselect-shrink-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="quickselect-shrink-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="quickselect-shrink-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="quickselect-shrink-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="quickselect-shrink-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="quickselect-shrink-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="850" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">84  Quickselect keeps one part</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Sorting and searching · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Round 1: pivot 7 = median of 7, 9, 1</text>
<text x="55" y="182" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">start 7 2 9 4 4 1; k = 2 is a sorted index</text>
<rect x="55" y="196" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="85.0" y="225.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">2</text>
<rect x="125" y="196" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="155.0" y="225.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<rect x="195" y="196" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="225.0" y="225.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<rect x="265" y="196" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="295.0" y="225.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<rect x="335" y="196" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="365.0" y="225.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">7</text>
<rect x="405" y="196" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="435.0" y="225.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">9</text>
<text x="55" y="260" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">[2 1 4 4] &lt; 7  [7] = 7  [9] &gt; 7</text>
<text x="55" y="286" font-size="18" fill="#9cbcff" text-anchor="start" font-weight="700">k = 2 is in the &lt; 7 part: keep [0..3] only.</text>
<circle cx="42" cy="323" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="329" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="330" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Round 2: pivot 2 = median of 2, 1, 4</text>
<rect x="55" y="356" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="85.0" y="385.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="125" y="356" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="155.0" y="385.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="195" y="356" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="225.0" y="385.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<rect x="265" y="356" width="60" height="44" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="295.0" y="385.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<rect x="335" y="356" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="365.0" y="385.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">7</text>
<rect x="405" y="356" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="435.0" y="385.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">9</text>
<text x="55" y="420" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">[1] &lt; 2  [2] = 2  [4 4] &gt; 2</text>
<text x="55" y="446" font-size="18" fill="#9cbcff" text-anchor="start" font-weight="700">k = 2 is in the &gt; 2 part: keep [2..3] only.</text>
<circle cx="42" cy="483" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="489" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="490" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Round 3: pivot 4 = median of 4, 4, 4</text>
<rect x="55" y="516" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="85.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="125" y="516" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="155.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="195" y="516" width="60" height="44" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="225.0" y="545.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">4</text>
<rect x="265" y="516" width="60" height="44" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="295.0" y="545.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">4</text>
<rect x="335" y="516" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="365.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">7</text>
<rect x="405" y="516" width="60" height="44" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="435.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">9</text>
<text x="55" y="580" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">[] &lt; 4  [4 4] = 4  [] &gt; 4</text>
<text x="55" y="606" font-size="18" fill="#86dca2" text-anchor="start" font-weight="700">k = 2 is in the = part: the answer is 4.</text>
<rect x="28" y="640" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="656" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">part that holds k, kept</text>
<rect x="280.128" y="640" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="314.128" y="656" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">discarded</text>
<rect x="28" y="672" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="688" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">equal part: the answer</text>
<rect x="28" y="712" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="743" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="772" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">k lies in one part of each partition:</text>
<text x="44" y="799" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">keep it, discard the rest.</text>
</svg>
