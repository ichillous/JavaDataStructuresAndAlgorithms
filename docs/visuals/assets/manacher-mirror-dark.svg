<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 895" width="520" height="895" role="img" aria-labelledby="title desc">
<title id="title">30  Manacher: reuse the mirror</title>
<desc id="desc">In cabacabad the palindrome abacaba around index 4 spans [1, 7]; index 5 copies radius 1 from index 3 and index 6 caps radius 3 from index 2 at the 2 units left, giving odd radii 1, 1, 3, 1, 4, 1, 2, 1, 1.</desc>
