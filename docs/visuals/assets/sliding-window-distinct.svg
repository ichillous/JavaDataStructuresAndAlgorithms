<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 892" width="520" height="892" role="img" aria-labelledby="title desc">
<title id="title">66  Window jumping a repeat</title>
<desc id="desc">longestSubstringWithoutRepeats on abcbad grows the window to abc, jumps its start to index 2 when b repeats, ignores the stale earlier a at index 0, and ends with the longest window cbad at indices 2 to 5.</desc>
