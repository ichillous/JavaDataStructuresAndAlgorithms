<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img" aria-labelledby="title desc">
<title id="title">29  Euler path</title>
<desc id="desc">A square with a diagonal and a pendant edge has odd degree only at vertices 0 and 4, so the Euler path starts at 0 and walks every edge once: 0, 1, 2, 3, 0, 2, 4.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="euler-path-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="euler-path-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="euler-path-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="euler-path-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="euler-path-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="euler-path-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="euler-path-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="euler-path-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="euler-path-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="euler-path-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker><marker id="euler-path-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1c6b3c"/></marker><marker id="euler-path-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#e3f4e8"/></marker><marker id="euler-path-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b3fb8"/></marker><marker id="euler-path-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f0eafb"/></marker><marker id="euler-path-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fde9e7"/></marker></defs>
<rect x="0" y="0" width="520" height="850" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">29  Euler path</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Graphs · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Count the degree of every vertex</text>
<line x1="146.0" y1="240.0" x2="244.0" y2="240.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="270.0" y1="266.0" x2="270.0" y2="306.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="244.0" y1="332.0" x2="146.0" y2="332.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="120.0" y1="306.0" x2="120.0" y2="266.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="142.16" y1="253.59" x2="247.84" y2="318.41" stroke="#8994a5" stroke-width="2.5"/>
<line x1="296.0" y1="332.0" x2="394.0" y2="332.0" stroke="#8994a5" stroke-width="2.5"/>
<circle cx="120" cy="240" r="22" fill="#fff3c4" stroke="#8a5e00" stroke-width="3"/>
<text x="120" y="247" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">0</text>
<text x="120" y="210" font-size="18" fill="#8a5e00" text-anchor="middle" font-weight="700">deg 3</text>
<circle cx="270" cy="240" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="270" y="247" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<text x="270" y="210" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="700">deg 2</text>
<circle cx="270" cy="332" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="270" y="339" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<text x="270" y="378" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="700">deg 4</text>
<circle cx="120" cy="332" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="120" y="339" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="120" y="378" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="700">deg 2</text>
<circle cx="420" cy="332" r="22" fill="#fff3c4" stroke="#8a5e00" stroke-width="3"/>
<text x="420" y="339" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">4</text>
<text x="420" y="378" font-size="18" fill="#8a5e00" text-anchor="middle" font-weight="700">deg 1</text>
<text x="28" y="412" font-size="18" fill="#1f2430" text-anchor="start" font-weight="700">Odd degree: {0, 4}. Start at the smaller, 0.</text>
<circle cx="42" cy="445" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="451" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="452" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Walk every edge once, 0 to 4</text>
<line x1="146.0" y1="510.0" x2="244.0" y2="510.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="270.0" y1="536.0" x2="270.0" y2="576.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="244.0" y1="602.0" x2="146.0" y2="602.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="120.0" y1="576.0" x2="120.0" y2="536.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="142.16" y1="523.59" x2="247.84" y2="588.41" stroke="#8994a5" stroke-width="2.5"/>
<line x1="296.0" y1="602.0" x2="394.0" y2="602.0" stroke="#8994a5" stroke-width="2.5"/>
<line x1="146.0" y1="510.0" x2="240.0" y2="510.0" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="195.0" y="494.0" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">1</text>
<line x1="270.0" y1="536.0" x2="270.0" y2="572.0" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="254.0" y="562.0" font-size="18" fill="#2451b7" text-anchor="end" font-weight="700">2</text>
<line x1="244.0" y1="602.0" x2="150.0" y2="602.0" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="195.0" y="586.0" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">3</text>
<line x1="120.0" y1="576.0" x2="120.0" y2="540.0" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="104.0" y="562.0" font-size="18" fill="#2451b7" text-anchor="end" font-weight="700">4</text>
<line x1="142.16" y1="523.59" x2="244.43" y2="586.32" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="203.37" y="548.36" font-size="18" fill="#2451b7" text-anchor="end" font-weight="700">5</text>
<line x1="296.0" y1="602.0" x2="390.0" y2="602.0" stroke="#2451b7" stroke-width="2.5" marker-end="url(#euler-path-blue-arrow)"/>
<text x="345.0" y="586.0" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">6</text>
<circle cx="120" cy="510" r="22" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="120" y="517" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">0</text>
<circle cx="270" cy="510" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="270" y="517" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<circle cx="270" cy="602" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="270" y="609" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<circle cx="120" cy="602" r="22" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="120" y="609" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<circle cx="420" cy="602" r="22" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="3"/>
<text x="420" y="609" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">4</text>
<text x="92" y="516" font-size="18" fill="#2451b7" text-anchor="end" font-weight="700">start</text>
<text x="448" y="608" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">end</text>
<text x="28" y="658" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Path  0  1  2  3  0  2  4   (6 edges)</text>
<rect x="28" y="680" width="26" height="20" rx="4" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="62" y="696" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">odd degree</text>
<rect x="183.36" y="680" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="217.36" y="696" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">start</text>
<rect x="281.696" y="680" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="315.696" y="696" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">end</text>
<rect x="28" y="718" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="749" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="778" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Connected edges with zero or two</text>
<text x="44" y="805" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">odd-degree vertices give an Euler path.</text>
</svg>
