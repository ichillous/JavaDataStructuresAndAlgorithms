<text x="62" y="644" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">matching pair</text>
<rect x="206.688" y="628" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="240.688" y="644" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">no match</text>
<rect x="28" y="660" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="62" y="676" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">duplicate sum, not stored</text>
<rect x="28" y="700" width="464" height="163" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="731" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="760" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Each half has only 2^(n/2) subsets, so</text>
<text x="44" y="787" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">storing one half&#x27;s sums and scanning</text>
<text x="44" y="814" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">the other&#x27;s finds a pair in about</text>
<text x="44" y="841" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">2^(n/2) steps, not 2^n.</text>
