<circle cx="42" cy="503" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="509" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="510" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Scan right sums in mask order</text>
<text x="66" y="538" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">mask 0: sum 0, need 6: not stored</text>
<text x="66" y="566" font-size="18" fill="#86dca2" text-anchor="start" font-weight="700">mask 1: sum 9, need -3: left mask 3 has it</text>
<text x="66" y="594" font-size="18" fill="#86dca2" text-anchor="start" font-weight="700">indices 0, 1, 3: 4 + -7 + 9 = 6</text>
