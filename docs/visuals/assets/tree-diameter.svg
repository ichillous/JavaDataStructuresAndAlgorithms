<rect x="28" y="708" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="739" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="768" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A sweep from any vertex ends at a</text>
<text x="44" y="795" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">diameter endpoint; sweep again from</text>
<text x="44" y="822" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">there.</text>
