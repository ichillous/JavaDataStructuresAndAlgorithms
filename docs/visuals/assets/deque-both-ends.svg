<text x="152.0" y="465.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">30</text>
<text x="152.0" y="508" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="196" y="434" width="72" height="48" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="232.0" y="465.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">40</text>
<text x="232.0" y="508" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2 tail</text>
<rect x="276" y="434" width="72" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="312.0" y="465.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">10</text>
<text x="312.0" y="508" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3 head</text>
<text x="436" y="452" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">front to back</text>
<text x="436" y="478" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">10 20 30 40</text>
<circle cx="42" cy="533" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="539" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="66" y="540" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">removeLast() = 40, removeFirst() = 10</text>
<rect x="36" y="562" width="72" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="72.0" y="593.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">20</text>
<text x="72.0" y="636" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0 head</text>
<rect x="116" y="562" width="72" height="48" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="152.0" y="593.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">30</text>
<text x="152.0" y="636" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1 tail</text>
<rect x="196" y="562" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="232.0" y="636" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="276" y="562" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="312.0" y="636" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<text x="436" y="580" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">front to back</text>
<text x="436" y="606" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">20 30</text>
<text x="28" y="674" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">Slots follow the circular-buffer rule (conceptual).</text>
<rect x="28" y="692" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="62" y="708" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">head: front</text>
<rect x="182.496" y="692" width="26" height="20" rx="4" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="216.496" y="708" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">tail: back</text>
<rect x="319.712" y="692" width="26" height="20" rx="4" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="353.712" y="708" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">free slot</text>
<rect x="28" y="732" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="763" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="792" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Both ends are indices on a circular</text>
<text x="44" y="819" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">buffer: addFirst steps the head back</text>
<text x="44" y="846" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">and wraps.</text>
</svg>
