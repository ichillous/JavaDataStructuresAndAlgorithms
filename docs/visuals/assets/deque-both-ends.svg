<text x="152.0" y="209.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">30</text>
<text x="152.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1 tail</text>
<rect x="196" y="178" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="232.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="276" y="178" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="312.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<text x="436" y="196" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">front to back</text>
<text x="436" y="222" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">20 30</text>
<circle cx="42" cy="277" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="283" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="284" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">addFirst(10): head wraps to slot 3</text>
<rect x="36" y="306" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="72.0" y="337.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">20</text>
<text x="72.0" y="380" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
