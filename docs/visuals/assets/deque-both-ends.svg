<text x="312.0" y="337.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">10</text>
<text x="312.0" y="380" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3 head</text>
<text x="436" y="324" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">front to back</text>
<text x="436" y="350" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">10 20 30</text>
<circle cx="42" cy="405" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="411" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="412" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">addLast(40): the buffer is full</text>
<rect x="36" y="434" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="72.0" y="465.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">20</text>
<text x="72.0" y="508" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
