<text x="152.0" y="337.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">30</text>
<text x="152.0" y="380" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1 tail</text>
