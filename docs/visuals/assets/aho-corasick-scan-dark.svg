<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 710" width="520" height="710" role="img" aria-labelledby="title desc">
<title id="title">32  Aho-Corasick scan</title>
<desc id="desc">Scanning ushers keeps the states root, s, sh, she, her and hers, and reports she at 1, he at 2 (through the link she to he) and hers at 2.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="aho-corasick-scan-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="aho-corasick-scan-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="aho-corasick-scan-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="aho-corasick-scan-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="aho-corasick-scan-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="aho-corasick-scan-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="aho-corasick-scan-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="aho-corasick-scan-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="aho-corasick-scan-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="aho-corasick-scan-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="aho-corasick-scan-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="aho-corasick-scan-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="aho-corasick-scan-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="aho-corasick-scan-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="aho-corasick-scan-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="710" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">32  Aho-Corasick scan</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Strings · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Scan ushers, keep one state</text>
<rect x="28" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="58.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">u</text>
<text x="58.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="98" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="128.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">s</text>
<text x="128.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="168" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="198.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">h</text>
<text x="198.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="238" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="268.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">e</text>
<text x="268.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="308" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="338.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">r</text>
<text x="338.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<rect x="378" y="178" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="408.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">s</text>
<text x="408.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">5</text>
<rect x="28" y="264" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="58.0" y="295.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">root</text>
<rect x="98" y="264" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="128.0" y="295.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">s</text>
<rect x="168" y="264" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="198.0" y="295.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">sh</text>
<rect x="238" y="264" width="60" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="268.0" y="295.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">she</text>
<rect x="308" y="264" width="60" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="338.0" y="295.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">her</text>
<rect x="378" y="264" width="60" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="408.0" y="295.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">hers</text>
<text x="28" y="336" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">Second row: longest trie prefix that ends here.</text>
<circle cx="42" cy="369" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="375" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="376" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Report what ends at each unit</text>
<rect x="28" y="406" width="94" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="75.0" y="427" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">she at 1</text>
<text x="178" y="427" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">unit 3: state she ends it</text>
<rect x="28" y="450" width="87" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="71.5" y="471" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">he at 2</text>
<text x="178" y="471" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">unit 3: link she → he</text>
<rect x="28" y="494" width="106" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="81.0" y="515" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">hers at 2</text>
<text x="178" y="515" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">unit 5: state hers ends it</text>
<rect x="28" y="536" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="552" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">state that is a pattern</text>
<rect x="28" y="576" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="607" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="636" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">One state per text unit; links report</text>
<text x="44" y="663" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">every pattern that ends at that unit.</text>
</svg>
