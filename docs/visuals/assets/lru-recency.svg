<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 930" width="520" height="930" role="img" aria-labelledby="title desc">
<title id="title">06  LRU: a hit changes the order</title>
<desc id="desc">Promote a cache hit before deciding which entry to evict next.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="lru-recency-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="lru-recency-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="lru-recency-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="lru-recency-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="lru-recency-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="lru-recency-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="lru-recency-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="lru-recency-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="lru-recency-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="lru-recency-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="930" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">06  LRU: a hit changes the order</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Linear structures · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="151" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1  Capacity = 2; fill the cache</text>
<text x="28" y="184" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">put(A); put(B)</text>
<rect x="96" y="213" width="136" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="164.0" y="244" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">A</text>
<text x="164.0" y="287" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">least recent</text>
<rect x="288" y="213" width="136" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="356.0" y="244" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">B</text>
<text x="356.0" y="287" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">most recent</text>
<line x1="242" y1="227" x2="278" y2="227" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<line x1="278" y1="247" x2="242" y2="247" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<text x="28" y="334" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2  get(A): move the hit to the right</text>
<rect x="96" y="367" width="136" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="164.0" y="398" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">B</text>
<text x="164.0" y="441" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">least recent</text>
<rect x="288" y="367" width="136" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="356.0" y="398" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">A</text>
<text x="356.0" y="441" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">most recent</text>
<line x1="242" y1="381" x2="278" y2="381" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<line x1="278" y1="401" x2="242" y2="401" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<text x="28" y="490" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3  put(C): evict B, append C</text>
<rect x="96" y="523" width="136" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="164.0" y="554" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">A</text>
<text x="164.0" y="597" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">least recent</text>
<rect x="288" y="523" width="136" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="356.0" y="554" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">C</text>
<text x="356.0" y="597" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">most recent</text>
<line x1="242" y1="537" x2="278" y2="537" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<line x1="278" y1="557" x2="242" y2="557" stroke="#2451b7" stroke-width="2.5" marker-end="url(#lru-recency-blue-arrow)"/>
<circle cx="260" cy="667" r="30" fill="#ffffff" stroke="#bd3026" stroke-width="2"/>
<text x="260" y="674" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">B</text>
<text x="260" y="721" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">Evicted: least recent before the put</text>
<rect x="28" y="760" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="791" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="820" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A hit changes recency. On overflow,</text>
<text x="44" y="847" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">evict the left end; the map points</text>
<text x="44" y="874" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">straight to the node to move.</text>
</svg>
