<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img" aria-labelledby="title desc">
<title id="title">67  Next greater by stack</title>
<desc id="desc">nextGreaterIndices on 2, 1, 2, 4, 3 keeps unresolved indices on a stack: index 1 is resolved by the second 2, the equal 2 at index 0 stays, and the 4 resolves indices 2 and 0, giving 3, 2, 3, -1, -1.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="monotonic-stack-next-greater-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="monotonic-stack-next-greater-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="monotonic-stack-next-greater-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="monotonic-stack-next-greater-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="monotonic-stack-next-greater-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="monotonic-stack-next-greater-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="monotonic-stack-next-greater-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="monotonic-stack-next-greater-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="monotonic-stack-next-greater-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="monotonic-stack-next-greater-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker><marker id="monotonic-stack-next-greater-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1c6b3c"/></marker><marker id="monotonic-stack-next-greater-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#e3f4e8"/></marker><marker id="monotonic-stack-next-greater-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b3fb8"/></marker><marker id="monotonic-stack-next-greater-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f0eafb"/></marker><marker id="monotonic-stack-next-greater-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fde9e7"/></marker></defs>
<rect x="0" y="0" width="520" height="860" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">67  Next greater by stack</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Array patterns · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="39" y="156" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Input values and their indices</text>
<rect x="39" y="170" width="52" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="65.0" y="201.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="65.0" y="244" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="99" y="170" width="52" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="125.0" y="201.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<text x="125.0" y="244" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="159" y="170" width="52" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="185.0" y="201.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="185.0" y="244" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="219" y="170" width="52" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="245.0" y="201.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">4</text>
<text x="245.0" y="244" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="279" y="170" width="52" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="305.0" y="201.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="305.0" y="244" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<text x="492" y="274" font-size="18" fill="#505b6b" text-anchor="end" font-weight="700">stack, bottom to top</text>
<circle cx="42" cy="299" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="305" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="306" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">i = 0, value 2: push 0</text>
<text x="66" y="332" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">stack is empty, nothing to compare</text>
<rect x="398" y="286" width="44" height="44" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="420.0" y="315.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">0</text>
<circle cx="42" cy="371" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="377" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="378" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">i = 1, value 1: push 1</text>
<text x="66" y="404" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">top value 2 is not less than 1</text>
<rect x="398" y="358" width="44" height="44" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="420.0" y="387.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<rect x="448" y="358" width="44" height="44" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="470.0" y="387.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">1</text>
<circle cx="42" cy="443" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="449" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="450" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">i = 2, value 2: pop 1, push 2</text>
<text x="66" y="476" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">answer[1] = 2; equal 2 stays</text>
<rect x="398" y="430" width="44" height="44" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="420.0" y="459.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<rect x="448" y="430" width="44" height="44" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="470.0" y="459.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">2</text>
<circle cx="42" cy="515" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="521" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="66" y="522" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">i = 3, value 4: pop 2, 0, push 3</text>
<text x="66" y="548" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">answer[2] = 3, answer[0] = 3</text>
<rect x="398" y="502" width="44" height="44" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="420.0" y="531.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">3</text>
<circle cx="42" cy="587" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="593" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="66" y="594" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">i = 4, value 3: push 4</text>
<text x="66" y="620" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">top value 4 is not less than 3</text>
<rect x="398" y="574" width="44" height="44" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="420.0" y="603.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<rect x="448" y="574" width="44" height="44" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="470.0" y="603.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">4</text>
<rect x="39" y="644" width="319" height="30" rx="15" fill="#f6f8fb" stroke="#1c6b3c" stroke-width="2"/>
<text x="198.5" y="665" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">next greater index: 3, 2, 3, -1, -1</text>
<rect x="28" y="688" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="62" y="704" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">top of the stack</text>
<rect x="28" y="728" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="759" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="788" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Each index is pushed once and popped</text>
<text x="44" y="815" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">once: O(n) despite the inner loop.</text>
</svg>
