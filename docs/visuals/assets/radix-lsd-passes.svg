<rect x="295" y="412" width="56" height="48" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="323.0" y="443.0" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">15</text>
<text x="323.0" y="486" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">d=1</text>
<rect x="359" y="412" width="56" height="48" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="387.0" y="443.0" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">25</text>
<text x="387.0" y="486" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">d=2</text>
<text x="39" y="514" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">ties keep the previous order:</text>
<rect x="39" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="67.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">15</text>
<rect x="103" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="131.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">21</text>
<rect x="167" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="195.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">25</text>
<rect x="231" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="259.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">31</text>
<rect x="295" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="323.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">35</text>
<rect x="359" y="524" width="56" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="387.0" y="555.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">41</text>
<rect x="28" y="586" width="26" height="20" rx="4" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="62" y="602" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">digit being read</text>
<rect x="223.104" y="586" width="26" height="20" rx="4" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="257.10400000000004" y="602" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">after the ones pass</text>
<rect x="28" y="618" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="634" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">after the tens pass</text>
<text x="28" y="664" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">Base 10 shown; radixSort uses 8-bit digits.</text>
<rect x="28" y="684" width="464" height="190" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="715" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="744" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Radix sort orders by the least</text>
<text x="44" y="771" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">significant digit first; because every</text>
<text x="44" y="798" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">pass is stable, ties keep the earlier</text>
<text x="44" y="825" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">order and the last pass leaves a full</text>
<text x="44" y="852" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">sort.</text>
</svg>
