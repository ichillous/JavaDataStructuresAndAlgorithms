<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 852" width="520" height="852" role="img" aria-labelledby="title desc">
<title id="title">64  One Floyd-Warshall round</title>
<desc id="desc">A 4-vertex directed graph: allowing vertex 1 as a stop-over improves the distance matrix entry d[0][2] from 9 to 5 because d[0][1] + d[1][2] = 3 + 2, and no other entry changes.</desc>
