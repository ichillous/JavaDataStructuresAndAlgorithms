<text x="120.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">2</text>
<text x="120.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="151" y="178" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="176.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">6</text>
<text x="176.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="207" y="178" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="232.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">4</text>
<text x="232.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="263" y="178" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="288.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">7</text>
<text x="288.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<rect x="319" y="178" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="344.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">3</text>
<text x="344.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="375" y="178" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="400.0" y="209.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">8</text>
<text x="400.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">6</text>
<rect x="431" y="178" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="456.0" y="209.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<text x="456.0" y="252" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">7</text>
<circle cx="42" cy="281" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="287" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="288" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">One block from each end covers it</text>
<path d="M 95 358 Q 95 350 103 350 H 196.0 Q 204.0 350 204.0 342 Q 204.0 350 212.0 350 H 305 Q 313 350 313 358" fill="none" stroke="#1c6b3c" stroke-width="2"/>
<text x="204.0" y="334" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">[1, 5) min 2</text>
<rect x="39" y="364" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="64.0" y="395.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="95" y="364" width="50" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="120.0" y="395.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">2</text>
<rect x="151" y="364" width="50" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="176.0" y="395.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">6</text>
<rect x="207" y="364" width="50" height="48" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="232.0" y="395.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">4</text>
<rect x="263" y="364" width="50" height="48" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="288.0" y="395.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">7</text>
<rect x="319" y="364" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="344.0" y="395.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">3</text>
<rect x="375" y="364" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="400.0" y="395.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">8</text>
<rect x="431" y="364" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="456.0" y="395.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<path d="M 207 418 Q 207 426 215 426 H 308.0 Q 316.0 426 316.0 434 Q 316.0 426 324.0 426 H 417 Q 425 426 425 418" fill="none" stroke="#2451b7" stroke-width="2"/>
<text x="316.0" y="454" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">[3, 7) min 3</text>
<circle cx="42" cy="481" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="487" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="488" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Combine the two answers</text>
<rect x="40" y="510" width="266" height="30" rx="15" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="173.0" y="531" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">min: min(2, 3) = 2, correct</text>
<rect x="40" y="552" width="308" height="30" rx="15" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="194.0" y="573" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">sum: 19 + 22 = 41, true sum 30</text>
<text x="40" y="610" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">4 + 7 was counted twice.</text>
<rect x="28" y="634" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="650" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">first block only</text>
<rect x="217.92" y="634" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="251.92" y="650" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">second block only</text>
<rect x="28" y="666" width="26" height="20" rx="4" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="62" y="682" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">in both blocks</text>
<rect x="208.416" y="666" width="26" height="20" rx="4" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="242.416" y="682" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">outside the range</text>
<rect x="28" y="706" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="737" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="766" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Minimum ignores the overlap of two</text>
<text x="44" y="793" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">blocks; a sum would count it twice.</text>
</svg>
