<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1110" width="520" height="1110" role="img" aria-labelledby="title desc">
<title id="title">03  Stack: last in, first out</title>
<desc id="desc">Push and pop share the top; the newest value leaves first.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="stack-lifo-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="stack-lifo-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="stack-lifo-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="stack-lifo-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="stack-lifo-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="stack-lifo-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="stack-lifo-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="stack-lifo-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="stack-lifo-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="stack-lifo-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1110" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">03  Stack: last in, first out</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Linear structures · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="151" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Push order: 10 → 20 → 30</text>
<text x="28" y="184" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">Top = final live array element</text>
<text x="200" y="212" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="400">1  push(30)</text>
<text x="320" y="212" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="400">2  pop → 30</text>
<line x1="220" y1="226" x2="220" y2="272" stroke="#2451b7" stroke-width="2.5" marker-end="url(#stack-lifo-blue-arrow)"/>
<line x1="300" y1="272" x2="300" y2="226" stroke="#bd3026" stroke-width="2.5" marker-end="url(#stack-lifo-red-arrow)"/>
<rect x="180" y="280" width="160" height="54" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260" y="315" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30</text>
<text x="370" y="315" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">index 2</text>
<rect x="180" y="342" width="160" height="54" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260" y="377" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">20</text>
<text x="370" y="377" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">index 1</text>
<rect x="180" y="404" width="160" height="54" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260" y="439" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<text x="370" y="439" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">index 0</text>
<text x="102" y="315" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">top</text>
<line x1="130" y1="308" x2="170" y2="308" stroke="#2451b7" stroke-width="2.5" marker-end="url(#stack-lifo-blue-arrow)"/>
<text x="260" y="494" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">bottom = first value pushed</text>
<text x="28" y="541" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3  After pop: the top moves down</text>
<rect x="180" y="570" width="160" height="54" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260" y="605" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">20</text>
<text x="370" y="605" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">index 1</text>
<rect x="180" y="632" width="160" height="54" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260" y="667" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<text x="370" y="667" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">index 0</text>
<text x="102" y="605" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">top</text>
<line x1="130" y1="598" x2="170" y2="598" stroke="#2451b7" stroke-width="2.5" marker-end="url(#stack-lifo-blue-arrow)"/>
<text x="260" y="728" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">pop() returned 30; top is now 20</text>
<text x="28" y="766" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Full pop order:</text>
<text x="260" y="802" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30 → 20 → 10</text>
<text x="28" y="850" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Stack: push and pop share one end. A FIFO</text>
<text x="28" y="877" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">queue uses opposite ends.</text>
<rect x="28" y="932" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="963" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="992" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">The top is the final live array</text>
<text x="44" y="1019" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">element. Appending and removing there</text>
<text x="44" y="1046" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">gives last-in, first-out order.</text>
</svg>
