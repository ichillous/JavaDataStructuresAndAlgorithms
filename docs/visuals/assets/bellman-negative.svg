<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1100" width="520" height="1100" role="img" aria-labelledby="title desc">
<title id="title">24  Negative edge or cycle?</title>
<desc id="desc">A negative edge yields -3; an added cycle makes targets 1 and 2 unbounded.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="bellman-negative-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="bellman-negative-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="bellman-negative-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="bellman-negative-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="bellman-negative-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="bellman-negative-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="bellman-negative-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="bellman-negative-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="bellman-negative-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="bellman-negative-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1100" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">24  Negative edge or cycle?</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Graphs · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="153" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Original edges solid; added edge dashed.</text>
<line x1="112.0" y1="235.0" x2="375.0" y2="235.0" stroke="#2451b7" stroke-width="4" marker-end="url(#bellman-negative-blue-arrow)"/>
<rect x="216.0" y="200" width="58" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="245" y="222" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">w=4</text>
<line x1="100.36425455345804" y1="259.68394491328246" x2="222.72659658215528" y2="408.0019352510973" stroke="#8994a5" stroke-width="2" marker-end="url(#bellman-negative-line-arrow)"/>
<rect x="116.0" y="328" width="58" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="145" y="350" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">w=5</text>
<line x1="389.635745446542" y1="259.68394491328246" x2="267.27340341784475" y2="408.0019352510973" stroke="#2451b7" stroke-width="4" marker-end="url(#bellman-negative-blue-arrow)"/>
<rect x="311.0" y="328" width="58" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="340" y="350" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">w=-7</text>
<path d="M 278 447 C 467 505 510 310 444 245" fill="none" stroke="#bd3026" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#bellman-negative-red-arrow)"/>
<rect x="361.5" y="408" width="113" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="418" y="430" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">added w=1</text>
<circle cx="80" cy="235" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="80" y="242" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">0</text>
<circle cx="410" cy="235" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="410" y="242" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<circle cx="245" cy="435" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="245" y="442" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<text x="28" y="520" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Distances before adding the extra edge:</text>
<rect x="28" y="541" width="120" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="88.0" y="572" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="88.0" y="615" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">v0</text>
<rect x="176" y="541" width="120" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="236.0" y="572" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">4</text>
<text x="236.0" y="615" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">v1</text>
<rect x="324" y="541" width="120" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="384.0" y="572" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">-3</text>
<text x="384.0" y="615" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">v2</text>
<text x="28" y="672" font-size="20" fill="#2451b7" text-anchor="start" font-weight="700">Best path: 0 → 1 → 2</text>
<text x="28" y="711" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Cost: 4 + (-7) = -3</text>
<text x="28" y="767" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">Add dashed 2 → 1 with w=1.</text>
<text x="28" y="806" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Cycle 1 → 2 → 1 costs -7 + 1 = -6.</text>
<text x="28" y="845" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">Targets 1 and 2: no finite minimum.</text>
<rect x="28" y="885" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="916" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="945" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Source 0 keeps distance 0. The</text>
<text x="44" y="972" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">reachable negative cycle makes targets</text>
<text x="44" y="999" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">1 and 2 unbounded, so this API rejects</text>
<text x="44" y="1026" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">the entire result.</text>
</svg>
