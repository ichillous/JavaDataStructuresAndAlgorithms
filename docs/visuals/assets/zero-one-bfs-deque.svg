<text x="260.0" y="274.0" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">0</text>
<line x1="369.19" y1="269.61" x2="408.07" y2="228.3" stroke="#1c6b3c" stroke-width="2.5" marker-end="url(#zero-one-bfs-deque-green-arrow)"/>
<text x="378.35" y="242.53" font-size="18" fill="#1c6b3c" text-anchor="end" font-weight="700">0</text>
<circle cx="90" cy="205" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="90" y="212" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">0</text>
<circle cx="430" cy="205" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="430" y="212" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<circle cx="170" cy="290" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="170" y="297" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<circle cx="350" cy="290" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="350" y="297" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<circle cx="42" cy="351" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="357" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="358" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Deque after each pop, front on the left</text>
<rect x="44" y="380" width="68" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="78.0" y="401" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">start</text>
<text x="124" y="401" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">source 0</text>
<rect x="300" y="380" width="44" height="30" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="322.0" y="402.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">0</text>
<rect x="44" y="418" width="76" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="82.0" y="439" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">pop 0</text>
<text x="132" y="439" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">2 front, 1 back</text>
<rect x="300" y="418" width="44" height="30" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="322.0" y="440.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">2</text>
<rect x="350" y="418" width="44" height="30" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="372.0" y="440.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">1</text>
<rect x="44" y="456" width="75" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="81.5" y="477" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">pop 2</text>
<text x="131" y="477" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">3 front</text>
<rect x="300" y="456" width="44" height="30" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="322.0" y="478.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">3</text>
<rect x="350" y="456" width="44" height="30" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="372.0" y="478.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">1</text>
<rect x="44" y="494" width="75" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="81.5" y="515" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">pop 3</text>
<text x="131" y="515" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">1 front, dist 1→0</text>
<rect x="300" y="494" width="44" height="30" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="322.0" y="516.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">1</text>
<rect x="350" y="494" width="44" height="30" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="372.0" y="516.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">1</text>
<rect x="44" y="532" width="72" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="80.0" y="553" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">pop 1</text>
<text x="128" y="553" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">no pushes</text>
<rect x="300" y="532" width="44" height="30" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="322.0" y="554.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">1</text>
<text x="28" y="588" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">The second 1 is skipped: 1 is already final. Route</text>
<text x="28" y="612" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">0 → 2 → 3 → 1 costs 0, not 1.</text>
<rect x="28" y="636" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="62" y="652" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">source</text>
<rect x="144.48" y="636" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="178.48" y="652" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">front push, weight 0</text>
<rect x="28" y="668" width="26" height="20" rx="4" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="62" y="684" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">back push, weight 1</text>
<rect x="28" y="708" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="739" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="768" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Zero-weight edges go to the deque&#x27;s</text>
<text x="44" y="795" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">front, unit-weight edges to its back.</text>
</svg>
