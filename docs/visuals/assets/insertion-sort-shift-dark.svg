<text x="44" y="721" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="750" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Insertion sort shifts only the larger</text>
