<text x="260" y="742" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">root</text>
<circle cx="260" cy="820" r="27" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="260" y="827" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">c</text>
<circle cx="260" cy="905" r="27" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="260" y="912" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">a</text>
<circle cx="180" cy="990" r="27" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="180" y="997" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">r</text>
<circle cx="340" cy="990" r="27" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="340" y="997" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">t</text>
<circle cx="180" cy="1075" r="27" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="180" y="1082" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">t</text>
<text x="75" y="997" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">prefix</text>
<text x="385" y="997" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">cat</text>
<text x="225" y="1082" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">cart</text>
<rect x="28" y="1145" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="1176" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1205" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Deleting a word clears its end marker.</text>
<text x="44" y="1232" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Keep nodes still needed by longer</text>
<text x="44" y="1259" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">words.</text>
</svg>
