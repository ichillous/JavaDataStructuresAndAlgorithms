<line x1="281.2463056691547" y1="927.5741997734768" x2="316.0122355348253" y2="964.5130002557519" stroke="#8291aa" stroke-width="2.5" marker-end="url(#trie-pruning-line-arrow)"/>
<line x1="180.0" y1="1021.0" x2="180.0" y2="1040.0" stroke="#8291aa" stroke-width="2.5" marker-end="url(#trie-pruning-line-arrow)"/>
