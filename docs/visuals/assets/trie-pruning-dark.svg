<circle cx="340" cy="480" r="27" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="340" y="487" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">t</text>
<circle cx="180" cy="565" r="27" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="180" y="572" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">t</text>
<text x="105" y="487" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">car</text>
<text x="385" y="487" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">cat</text>
<text x="225" y="572" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">cart</text>
<text x="28" y="660" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">2  Remove car; keep cart and cat</text>
<rect x="28" y="690" width="464" height="425" rx="8" fill="#192333" stroke="#8291aa" stroke-width="2"/>
<line x1="260.0" y1="766.0" x2="260.0" y2="785.0" stroke="#8291aa" stroke-width="2.5" marker-end="url(#trie-pruning-line-arrow)"/>
<line x1="260.0" y1="851.0" x2="260.0" y2="870.0" stroke="#8291aa" stroke-width="2.5" marker-end="url(#trie-pruning-line-arrow)"/>
