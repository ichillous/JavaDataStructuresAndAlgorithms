<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 810" width="520" height="810" role="img" aria-labelledby="title desc">
<title id="title">74  Two pointers, sorted array</title>
<desc id="desc">pairWithSum on 1, 2, 3, 4, 6 with target 6 starts at the two ends: 1 + 6 is too large so the right index drops, 1 + 4 is too small so the left index drops, and 2 + 4 matches at indices 1 and 3.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="two-pointers-pair-sum-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="two-pointers-pair-sum-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="two-pointers-pair-sum-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="two-pointers-pair-sum-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="two-pointers-pair-sum-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="two-pointers-pair-sum-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="two-pointers-pair-sum-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="two-pointers-pair-sum-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="two-pointers-pair-sum-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="two-pointers-pair-sum-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="two-pointers-pair-sum-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="two-pointers-pair-sum-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="two-pointers-pair-sum-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="two-pointers-pair-sum-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="two-pointers-pair-sum-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="810" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">74  Two pointers, sorted array</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Array patterns · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">1 + 6 = 7: too large</text>
<rect x="39" y="178" width="56" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="67.0" y="209.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<text x="67.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">left 0</text>
<rect x="103" y="178" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="131.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">2</text>
<rect x="167" y="178" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="195.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<rect x="231" y="178" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="259.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">4</text>
<rect x="295" y="178" width="56" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="323.0" y="209.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">6</text>
<text x="323.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">right 4</text>
<text x="39" y="278" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">6 is too large even with the smallest, 1</text>
<circle cx="42" cy="317" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="323" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="324" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">1 + 4 = 5: too small</text>
<rect x="39" y="346" width="56" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="67.0" y="377.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<text x="67.0" y="420" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">left 0</text>
<rect x="103" y="346" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="131.0" y="377.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">2</text>
<rect x="167" y="346" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="195.0" y="377.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<rect x="231" y="346" width="56" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="259.0" y="377.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">4</text>
<text x="259.0" y="420" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">right 3</text>
<rect x="295" y="346" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="323.0" y="377.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">6</text>
<text x="39" y="446" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">1 is too small even with the largest, 4</text>
<circle cx="42" cy="485" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="491" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="492" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">2 + 4 = 6: match</text>
<rect x="39" y="514" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="67.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="103" y="514" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="131.0" y="545.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">2</text>
<text x="131.0" y="588" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">left 1</text>
<rect x="167" y="514" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="195.0" y="545.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<rect x="231" y="514" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="259.0" y="545.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">4</text>
<text x="259.0" y="588" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">right 3</text>
<rect x="295" y="514" width="56" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="323.0" y="545.0" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">6</text>
<text x="39" y="614" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">Indices 1 and 3 sum to the target 6</text>
<rect x="28" y="638" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="654" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">left and right</text>
<rect x="199.776" y="638" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="233.776" y="654" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">dropped</text>
<rect x="329.216" y="638" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="363.216" y="654" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">match</text>
<rect x="28" y="678" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="709" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="738" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Each move drops an index with no</text>
<text x="44" y="765" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">partner: at most n - 1 moves.</text>
</svg>
