<text x="156.0" y="236.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<rect x="194" y="212" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="232.0" y="236.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">1200</text>
<rect x="270" y="212" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="308.0" y="236.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">700</text>
<rect x="346" y="212" width="76" height="34" rx="3" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="384.0" y="236.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1400</text>
<text x="106" y="269.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">A2</text>
<rect x="118" y="246" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="194" y="246" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="232.0" y="270.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<rect x="270" y="246" width="76" height="34" rx="3" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="308.0" y="270.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">400</text>
<rect x="346" y="246" width="76" height="34" rx="3" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="384.0" y="270.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">650</text>
<text x="106" y="303.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">A3</text>
<rect x="118" y="280" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="194" y="280" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="270" y="280" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="308.0" y="304.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<rect x="346" y="280" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="384.0" y="304.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">10000</text>
<text x="106" y="337.0" font-size="18" fill="#bec9da" text-anchor="end" font-weight="400">A4</text>
<rect x="118" y="314" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="194" y="314" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="270" y="314" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<rect x="346" y="314" width="76" height="34" rx="3" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="384.0" y="338.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<circle cx="42" cy="381" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="387" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="388" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Try each k; d = 30, 1, 40, 10, 25</text>
<text x="66" y="416" font-size="18" fill="#86dca2" text-anchor="start" font-weight="700">k=1: 0 + 650 + 30*1*25 = 1400  (smallest)</text>
<text x="66" y="444" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">k=2: 1200 + 10000 + 30*40*25 = 41200</text>
<text x="66" y="472" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">k=3: 700 + 0 + 30*10*25 = 8200</text>
<circle cx="42" cy="521" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="527" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="528" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Follow the splits</text>
<rect x="300" y="514" width="165" height="30" rx="15" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="382.5" y="535" font-size="18" fill="#86dca2" text-anchor="middle" font-weight="700">(A1((A2A3)A4))</text>
<text x="66" y="564" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">split[1][4] = 1: A1 | A2..A4</text>
<text x="66" y="592" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">split[2][4] = 3: A2..A3 | A4</text>
<text x="66" y="620" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">split[2][3] = 2: A2 | A3</text>
<rect x="28" y="646" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="662" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">whole chain</text>
<rect x="190.272" y="646" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="224.272" y="662" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">split the answer reuses</text>
<rect x="28" y="686" width="464" height="163" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="717" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="746" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Each cell keeps the cheapest split k;</text>
<text x="44" y="773" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">following the stored splits from the</text>
<text x="44" y="800" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">whole chain down gives the</text>
<text x="44" y="827" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">parenthesization.</text>
</svg>
