<text x="128.0" y="209.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">+3</text>
<text x="128.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="163" y="178" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="190.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="190.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="225" y="178" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="252.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="252.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="287" y="178" width="54" height="48" rx="8" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="314.0" y="209.0" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">-3</text>
<text x="314.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<rect x="349" y="178" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="376.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="376.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">spare</text>
<circle cx="42" cy="281" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="287" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="288" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Add +2 on [0, 2): two more</text>
<rect x="39" y="310" width="54" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="66.0" y="341.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">+2</text>
<text x="66.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="101" y="310" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="128.0" y="341.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">+3</text>
<text x="128.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="163" y="310" width="54" height="48" rx="8" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="190.0" y="341.0" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">-2</text>
<text x="190.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="225" y="310" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="252.0" y="341.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="252.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="287" y="310" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="314.0" y="341.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">-3</text>
<text x="314.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<rect x="349" y="310" width="54" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="376.0" y="341.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="376.0" y="384" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">spare</text>
<circle cx="42" cy="413" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="419" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="420" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">One running sum recovers the values</text>
<rect x="39" y="442" width="54" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="66.0" y="473.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">2</text>
<text x="66.0" y="516" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="101" y="442" width="54" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="128.0" y="473.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">5</text>
<text x="128.0" y="516" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="163" y="442" width="54" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="190.0" y="473.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">3</text>
<text x="190.0" y="516" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="225" y="442" width="54" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="252.0" y="473.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">3</text>
<text x="252.0" y="516" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="287" y="442" width="54" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="314.0" y="473.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">0</text>
<text x="314.0" y="516" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<text x="39" y="542" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">sums: 2, 5, 3, 3, 0</text>
<rect x="28" y="568" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="584" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">range start: add</text>
<rect x="226.56" y="568" width="26" height="20" rx="4" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="260.56" y="584" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">range end: undo</text>
<rect x="28" y="600" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="616" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">value after the sum</text>
<rect x="28" y="640" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="671" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="700" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Two marks per update, then one running</text>
<text x="44" y="727" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">sum: O(n + u) in total.</text>
</svg>
