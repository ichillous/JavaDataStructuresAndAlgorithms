<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img" aria-labelledby="title desc">
<title id="title">74  Three local repairs</title>
<desc id="desc">Rotate left turns black 1 with a red right child 2 into black 2 with a red left child 1. Rotate right turns black 3 over red 2 over red 1 into black 2 with red children 1 and 3. Flip colors turns black 2 with red children into red 2 with black children.</desc>
