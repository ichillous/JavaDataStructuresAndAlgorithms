<rect x="28" y="674" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="705" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="734" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Arrival i is kept with chance k/i, so</text>
<text x="44" y="761" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">every item seen so far ends up in the</text>
<text x="44" y="788" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">sample with equal chance.</text>
