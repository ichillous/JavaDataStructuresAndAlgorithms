<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 880" width="520" height="880" role="img" aria-labelledby="title desc">
<title id="title">31  Aho-Corasick links</title>
<desc id="desc">The trie of he, she, his and hers, then its failure links listed one per row: sh to h, she to he, his to s and hers to s; every other node links to the root.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="aho-corasick-links-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="aho-corasick-links-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="aho-corasick-links-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="aho-corasick-links-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="aho-corasick-links-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="aho-corasick-links-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="aho-corasick-links-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="aho-corasick-links-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="aho-corasick-links-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="aho-corasick-links-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="aho-corasick-links-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="aho-corasick-links-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="aho-corasick-links-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="aho-corasick-links-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="aho-corasick-links-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="880" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">31  Aho-Corasick links</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Strings · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Trie of he, she, his, hers</text>
<line x1="286.57" y1="236.78" x2="303.43" y2="251.22" stroke="#8291aa" stroke-width="2.5"/>
<line x1="302.0" y1="295.0" x2="278.0" y2="313.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="250.0" y1="369.0" x2="250.0" y2="359.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="250.0" y1="429.0" x2="250.0" y2="419.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="358.0" y1="295.0" x2="382.0" y2="313.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="410.0" y1="369.0" x2="410.0" y2="359.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="226.8" y1="225.07" x2="113.2" y2="262.93" stroke="#8291aa" stroke-width="2.5"/>
<line x1="80.0" y1="309.0" x2="80.0" y2="299.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="80.0" y1="369.0" x2="80.0" y2="359.0" stroke="#8291aa" stroke-width="2.5"/>
<circle cx="260" cy="214" r="31" fill="#111827" stroke="#8291aa" stroke-width="3" stroke-dasharray="6 5"/>
<text x="260" y="221" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="700">root</text>
<circle cx="330" cy="274" r="31" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="330" y="281" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">h</text>
<circle cx="250" cy="334" r="31" fill="#173527" stroke="#86dca2" stroke-width="3"/>
<text x="250" y="341" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">he</text>
<circle cx="250" cy="394" r="31" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="250" y="401" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">her</text>
<circle cx="250" cy="454" r="31" fill="#173527" stroke="#86dca2" stroke-width="3"/>
<text x="250" y="461" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">hers</text>
<circle cx="410" cy="334" r="31" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="410" y="341" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">hi</text>
<circle cx="410" cy="394" r="31" fill="#173527" stroke="#86dca2" stroke-width="3"/>
<text x="410" y="401" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">his</text>
<circle cx="80" cy="274" r="31" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="80" y="281" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">s</text>
<circle cx="80" cy="334" r="31" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="80" y="341" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">sh</text>
<circle cx="80" cy="394" r="31" fill="#173527" stroke="#86dca2" stroke-width="3"/>
<text x="80" y="401" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">she</text>
<circle cx="42" cy="514" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="520" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="521" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Failure links</text>
<text x="28" y="551" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">A link is the longest proper suffix of a node</text>
<text x="28" y="577" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">that is also a trie prefix. All others: root.</text>
<text x="56" y="621" font-size="20" fill="#cdb6ff" text-anchor="start" font-weight="700">sh → h</text>
<text x="276" y="621" font-size="20" fill="#cdb6ff" text-anchor="start" font-weight="700">she → he</text>
<text x="56" y="657" font-size="20" fill="#cdb6ff" text-anchor="start" font-weight="700">his → s</text>
<text x="276" y="657" font-size="20" fill="#cdb6ff" text-anchor="start" font-weight="700">hers → s</text>
<rect x="28" y="679" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="695" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">a pattern ends here</text>
<rect x="257.664" y="679" width="26" height="20" rx="4" fill="#111827" stroke="#8291aa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="291.664" y="695" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">root</text>
<rect x="28" y="719" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="750" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="779" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">A failure link points at the longest</text>
<text x="44" y="806" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">suffix of a node that is still in the</text>
<text x="44" y="833" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">trie.</text>
</svg>
