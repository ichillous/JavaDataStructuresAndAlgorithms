<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img" aria-labelledby="title desc">
<title id="title">31  Aho-Corasick links</title>
<desc id="desc">The trie of he, she, his and hers has failure links, labelled beside their nodes, sh to h, she to he, his to s and hers to s; scanning ushers keeps s, sh, she, her, hers and reports she at 1, he at 2 and hers at 2.</desc>
