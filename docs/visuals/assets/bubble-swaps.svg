<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1060" width="520" height="1060" role="img" aria-labelledby="title desc">
<title id="title">21  Bubble sort: adjacent swaps</title>
<desc id="desc">Swap neighboring values; each pass settles a maximum on the right.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="bubble-swaps-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="bubble-swaps-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="bubble-swaps-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="bubble-swaps-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="bubble-swaps-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="bubble-swaps-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="bubble-swaps-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="bubble-swaps-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="bubble-swaps-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="bubble-swaps-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1060" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">21  Bubble sort: adjacent swaps</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Algorithm traces · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Pass 1: compare indices 0 → 1</text>
<rect x="101.0" y="180" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="146.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="146.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="215.0" y="180" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<text x="260.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="329.0" y="180" width="90" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="374.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="374.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<line x1="195.0" y1="196" x2="211.0" y2="196" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<line x1="211.0" y1="215" x2="195.0" y2="215" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<text x="28" y="291" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">3 &gt; 1: swap only these neighbors.</text>
<line x1="260" y1="313" x2="260" y2="335" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<text x="28" y="365" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">After swap: compare indices 1 → 2</text>
<rect x="101.0" y="390" width="90" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="146.0" y="421" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<text x="146.0" y="464" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="215.0" y="390" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260.0" y="421" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="260.0" y="464" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="329.0" y="390" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="374.0" y="421" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<text x="374.0" y="464" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<line x1="309.0" y1="406" x2="325.0" y2="406" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<line x1="325.0" y1="425" x2="309.0" y2="425" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<text x="28" y="501" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">3 &gt; 2: another adjacent swap.</text>
<line x1="260" y1="523" x2="260" y2="545" stroke="#2451b7" stroke-width="2.5" marker-end="url(#bubble-swaps-blue-arrow)"/>
<text x="28" y="575" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Pass 2 compares indices 0 → 1</text>
<rect x="101.0" y="600" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="146.0" y="631" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<text x="146.0" y="674" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="215.0" y="600" width="90" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260.0" y="631" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<text x="260.0" y="674" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="329.0" y="600" width="90" height="48" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="374.0" y="631" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="374.0" y="674" font-size="18" fill="#8a5e00" text-anchor="middle" font-weight="400">2 fixed</text>
<text x="28" y="720" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Maximum 3 is fixed after pass 1.</text>
<text x="28" y="760" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">1 ≤ 2: no swap; pass 2 changes nothing.</text>
<text x="28" y="800" font-size="20" fill="#2451b7" text-anchor="start" font-weight="700">Stop early. Result: [1, 2, 3].</text>
<rect x="28" y="840" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="871" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="900" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Each adjacent comparison moves the</text>
<text x="44" y="927" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">larger value right. After a pass, the</text>
<text x="44" y="954" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">unsorted range&#x27;s maximum is fixed at</text>
<text x="44" y="981" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">its end; a swap-free pass stops.</text>
</svg>
