<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 882" width="520" height="882" role="img" aria-labelledby="title desc">
<title id="title">30  Kruskal and Prim</title>
<desc id="desc">One weighted graph on five vertices has a minimum spanning tree of total weight 11. Kruskal keeps edges in the order 1, 2, 3, 5 and skips two that close a cycle, while Prim from vertex 0 picks 1, 2, 5, 3.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
