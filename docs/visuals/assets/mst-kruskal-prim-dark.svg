<text x="279.0" y="658" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3→4</text>
<rect x="28" y="686" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="702" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">edge kept</text>
<rect x="171.26399999999998" y="686" width="26" height="20" rx="4" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="205.26399999999998" y="702" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">closes a cycle</text>
<rect x="28" y="724" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="755" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="784" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Both algorithms add cheapest safe</text>
<text x="44" y="811" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">edges, in different orders, to reach</text>
<text x="44" y="838" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">one total.</text>
