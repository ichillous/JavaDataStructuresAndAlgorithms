<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 852" width="520" height="852" role="img" aria-labelledby="title desc">
<title id="title">54  Sieve of Eratosthenes</title>
<desc id="desc">NumberTheory.primesUpTo(30) on a grid of 1 to 30: 2 crosses out 14 multiples from 4, 3 crosses out 4 more from 9, 5 crosses out 25, and the ten numbers never crossed are the primes 2, 3, 5, 7, 11, 13, 17, 19, 23 and 29.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
