<text x="66" y="156" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Each prime starts at its square</text>
<text x="48" y="190" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">p = 2: start at 4</text>
<text x="492" y="190" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">14 new</text>
