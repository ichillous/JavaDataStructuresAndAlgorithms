<text x="492" y="220" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">4 new</text>
<text x="48" y="250" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">p = 5: start at 25, skip 10, 15, 20</text>
<text x="492" y="250" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">1 new</text>
<text x="48" y="280" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">7×7 = 49 is past 30: stop</text>
