<text x="290" y="272" font-size="18" fill="#6b3fb8" text-anchor="middle" font-weight="700">size 4</text>
<text x="350" y="227" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">one tree, size 9</text>
<text x="28" y="316" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">4 &lt; 5: root 4 gets parent 0.</text>
