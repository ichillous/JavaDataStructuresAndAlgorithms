<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img" aria-labelledby="title desc">
<title id="title">32  Path compression</title>
<desc id="desc">In a UnionFind over 9 indices, union(0, 5) hangs the size-4 root 4 under the size-5 root 0. Before find(7) the path is 7, 6, 4, 0; afterwards 7 and 6 point directly at 0.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
