<text x="28" y="775" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Result: [1, 3]; matches may overlap.</text>
<rect x="28" y="820" width="464" height="163" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="851" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="880" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">After a match, retain the longest</text>
<text x="44" y="907" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">matched suffix that is also a pattern</text>
<text x="44" y="934" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">prefix. This preserves overlapping</text>
<text x="44" y="961" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">matches without rescanning text.</text>
</svg>
