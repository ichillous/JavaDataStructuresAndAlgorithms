<text x="28" y="423" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="400">prefix[2] = 1: retain suffix &#x27;a&#x27;.</text>
<text x="28" y="462" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Next: text[4] versus pattern[1].</text>
<line x1="260" y1="484" x2="260" y2="509" stroke="#9cbcff" stroke-width="2.5" marker-end="url(#kmp-overlap-blue-arrow)"/>
