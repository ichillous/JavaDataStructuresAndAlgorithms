<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1220" width="520" height="1220" role="img" aria-labelledby="title desc">
<title id="title">20  Greedy: finish first</title>
<desc id="desc">Choose earliest finishing intervals; touching endpoints remain compatible.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="activity-selection-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="activity-selection-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="activity-selection-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="activity-selection-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="activity-selection-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="activity-selection-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="activity-selection-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="activity-selection-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="activity-selection-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="activity-selection-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker></defs>
<rect x="0" y="0" width="520" height="1220" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">20  Greedy: finish first</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Algorithm traces · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Sort by finishing time first.</text>
<text x="260" y="194" font-size="20" fill="#bec9da" text-anchor="middle" font-weight="400">time (arbitrary units)</text>
<line x1="70" y1="220" x2="475" y2="220" stroke="#bec9da" stroke-width="2.5" marker-end="url(#activity-selection-muted-arrow)"/>
<line x1="70.0" y1="214" x2="70.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="70.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<line x1="70.0" y1="270" x2="70.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="135.0" y1="214" x2="135.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="135.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<line x1="135.0" y1="270" x2="135.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="200.0" y1="214" x2="200.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="200.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<line x1="200.0" y1="270" x2="200.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="265.0" y1="214" x2="265.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="265.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<line x1="265.0" y1="270" x2="265.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="330.0" y1="214" x2="330.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="330.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<line x1="330.0" y1="270" x2="330.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="395.0" y1="214" x2="395.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="395.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">5</text>
<line x1="395.0" y1="270" x2="395.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<line x1="460.0" y1="214" x2="460.0" y2="226" stroke="#bec9da" stroke-width="2"/>
<text x="460.0" y="252" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">6</text>
<line x1="460.0" y1="270" x2="460.0" y2="710" stroke="#8291aa" stroke-width="1" stroke-dasharray="7 5"/>
<rect x="28" y="264" width="464" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="28" y="289" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="700">B  [1, 2)  TAKE</text>
<rect x="135.0" y="312" width="65.0" height="28" rx="0" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<rect x="28" y="354" width="464" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="28" y="379" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="700">A  [0, 3)  SKIP: overlap</text>
<rect x="70.0" y="402" width="195.0" height="28" rx="0" fill="#111827" stroke="#ffaaa1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="28" y="444" width="464" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="28" y="469" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="700">C  [2, 4)  TAKE</text>
<rect x="200.0" y="492" width="130.0" height="28" rx="0" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<rect x="28" y="534" width="464" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="28" y="559" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="700">D  [3, 5)  SKIP: overlap</text>
<rect x="265.0" y="582" width="130.0" height="28" rx="0" fill="#111827" stroke="#ffaaa1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="28" y="624" width="464" height="34" rx="0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="28" y="649" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="700">E  [4, 6)  TAKE</text>
<rect x="330.0" y="672" width="130.0" height="28" rx="0" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="28" y="760" font-size="20" fill="#9cbcff" text-anchor="start" font-weight="700">[1, 2) → [2, 4) → [4, 6)</text>
<text x="28" y="801" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Touching endpoints are compatible.</text>
<rect x="28" y="840" width="464" height="110" rx="8" fill="#111827" stroke="#ffaaa1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="44" y="878" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="400">Tempting: [0, 3) → [3, 5)</text>
<text x="44" y="918" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="400">Only 2 activities; chosen schedule has 3.</text>
<rect x="28" y="992" width="464" height="190" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="1023" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1052" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">The earliest finishing compatible</text>
<text x="44" y="1079" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">activity leaves at least as much time</text>
<text x="44" y="1106" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">for everything that follows. This</text>
<text x="44" y="1133" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">maximizes the count, not total</text>
<text x="44" y="1160" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">duration.</text>
</svg>
