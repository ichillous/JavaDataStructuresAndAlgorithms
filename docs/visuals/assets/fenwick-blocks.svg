<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1125" width="520" height="1125" role="img" aria-labelledby="title desc">
<title id="title">11  Fenwick prefix blocks</title>
<desc id="desc">For values 2,-1,4,3, one-based Fenwick slots cover [0,1), [0,2), [2,3) and [0,4). The prefix ending at zero-based boundary 3 combines slots 3 and 2: 4+1=5.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fenwick-blocks-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="fenwick-blocks-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="fenwick-blocks-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="fenwick-blocks-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="fenwick-blocks-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="fenwick-blocks-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="fenwick-blocks-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="fenwick-blocks-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="fenwick-blocks-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="fenwick-blocks-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1125" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">11  Fenwick prefix blocks</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Trees and ranges · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1  Values use zero-based positions</text>
<rect x="116" y="185" width="60" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="146.0" y="216" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="146.0" y="259" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="192" y="185" width="60" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="222.0" y="216" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">-1</text>
<text x="222.0" y="259" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="268" y="185" width="60" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="298.0" y="216" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">4</text>
<text x="298.0" y="259" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="344" y="185" width="60" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="374.0" y="216" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="374.0" y="259" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<text x="28" y="310" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2  Internal slots store low-bit blocks</text>
<text x="222" y="343" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<text x="286" y="343" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<text x="350" y="343" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<text x="414" y="343" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<text x="45" y="396" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">t[1] = 2</text>
<text x="45" y="430" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">length 1</text>
<rect x="190" y="365" width="64" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="222.0" y="396" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">[0,1)</text>
<text x="45" y="483" font-size="20" fill="#2451b7" text-anchor="start" font-weight="400">t[2] = 1</text>
<text x="45" y="517" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">length 2</text>
<rect x="190" y="452" width="128" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="254.0" y="483" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">[0,2)</text>
<text x="45" y="570" font-size="20" fill="#2451b7" text-anchor="start" font-weight="400">t[3] = 4</text>
<text x="45" y="604" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">length 1</text>
<rect x="318" y="539" width="64" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="350.0" y="570" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">[2,3)</text>
<text x="45" y="657" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">t[4] = 8</text>
<text x="45" y="691" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">length 4</text>
<rect x="190" y="626" width="256" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="318.0" y="657" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">[0,4)</text>
<text x="28" y="755" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3  prefixSum(3): 3 → 2 → 0</text>
<text x="45" y="800" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">t[3] + t[2] = 4 + 1 = 5</text>
<text x="45" y="850" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Subtract the lowest set bit to move</text>
<text x="45" y="877" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">left. These blocks cover [0,3) exactly</text>
<text x="45" y="904" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">once.</text>
<rect x="28" y="960" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="991" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1020" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A prefix query combines disjoint</text>
<text x="44" y="1047" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">blocks. The low bit gives each block&#x27;s</text>
<text x="44" y="1074" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">length.</text>
</svg>
