<line x1="195.0" y1="226.0" x2="240.0" y2="226.0" stroke="#8994a5" stroke-width="2.5" marker-end="url(#singly-insert-after-line-arrow)"/>
<line x1="300" y1="226" x2="440" y2="226" stroke="#505b6b" stroke-width="2.5" marker-end="url(#singly-insert-after-muted-arrow)"/>
<text x="466" y="232" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">null</text>
<circle cx="462" cy="150" r="24" fill="#fff3c4" stroke="#8a5e00" stroke-width="3"/>
<text x="462" y="157" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">15</text>
<text x="430" y="157" font-size="18" fill="#8a5e00" text-anchor="end" font-weight="700">new, not linked</text>
<circle cx="42" cy="275" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="281" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="282" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Right order: copy the link, then redirect</text>
<rect x="44" y="304" width="85" height="30" rx="15" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="86.5" y="325" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">write 1</text>
<text x="141" y="325" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">15.next = 10.next</text>
<rect x="44" y="340" width="89" height="30" rx="15" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="88.5" y="361" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">write 2</text>
<text x="145" y="361" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">10.next = 15</text>
<circle cx="62" cy="416" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="62" y="423" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">10</text>
<circle cx="167" cy="416" r="24" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="3"/>
<text x="167" y="423" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">15</text>
<circle cx="272" cy="416" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="272" y="423" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">20</text>
<circle cx="377" cy="416" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="377" y="423" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30</text>
<line x1="90.0" y1="416.0" x2="135.0" y2="416.0" stroke="#1c6b3c" stroke-width="2.5" marker-end="url(#singly-insert-after-green-arrow)"/>
<text x="114.5" y="400.0" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">2</text>
<line x1="195.0" y1="416.0" x2="240.0" y2="416.0" stroke="#1c6b3c" stroke-width="2.5" marker-end="url(#singly-insert-after-green-arrow)"/>
<text x="219.5" y="400.0" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">1</text>
<line x1="300.0" y1="416.0" x2="345.0" y2="416.0" stroke="#8994a5" stroke-width="2.5" marker-end="url(#singly-insert-after-line-arrow)"/>
<line x1="405" y1="416" x2="440" y2="416" stroke="#505b6b" stroke-width="2.5" marker-end="url(#singly-insert-after-muted-arrow)"/>
<text x="466" y="422" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">null</text>
<circle cx="42" cy="475" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="481" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="482" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Wrong order: redirect first</text>
<rect x="44" y="504" width="85" height="30" rx="15" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="86.5" y="525" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">write 1</text>
<text x="141" y="525" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">10.next = 15</text>
<rect x="44" y="540" width="89" height="30" rx="15" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="88.5" y="561" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">write 2</text>
<text x="145" y="561" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">15.next = 10.next</text>
<circle cx="62" cy="604" r="24" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="62" y="611" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">10</text>
<circle cx="167" cy="604" r="24" fill="#fff3c4" stroke="#8a5e00" stroke-width="3"/>
<text x="167" y="611" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">15</text>
<circle cx="272" cy="604" r="24" fill="#fde9e7" stroke="#bd3026" stroke-width="3"/>
<text x="272" y="611" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">20</text>
<circle cx="377" cy="604" r="24" fill="#fde9e7" stroke="#bd3026" stroke-width="3"/>
<text x="377" y="611" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">30</text>
<line x1="90.0" y1="604.0" x2="135.0" y2="604.0" stroke="#bd3026" stroke-width="2.5" marker-end="url(#singly-insert-after-red-arrow)"/>
<line x1="300.0" y1="604.0" x2="345.0" y2="604.0" stroke="#bd3026" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#singly-insert-after-red-arrow)"/>
<line x1="405" y1="604" x2="440" y2="604" stroke="#505b6b" stroke-width="2.5" marker-end="url(#singly-insert-after-muted-arrow)"/>
<text x="466" y="610" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">null</text>
<path d="M 181 630 C 201 670 133 670 153 630" fill="none" stroke="#bd3026" stroke-width="2.5" marker-end="url(#singly-insert-after-red-arrow)"/>
<text x="167" y="700" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">15.next = 15</text>
<path d="M 248 634 Q 248 642 256 642 H 316.5 Q 324.5 642 324.5 650 Q 324.5 642 332.5 642 H 393 Q 401 642 401 634" fill="none" stroke="#bd3026" stroke-width="2"/>
<text x="324.5" y="670" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">20 and 30 unreachable</text>
<rect x="28" y="712" width="26" height="20" rx="4" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="62" y="728" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">new node</text>
<rect x="169.536" y="712" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="203.536" y="728" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">linked</text>
<rect x="279.10400000000004" y="712" width="26" height="20" rx="4" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="313.10400000000004" y="728" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">lost</text>
<rect x="28" y="752" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="783" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="812" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Link the new node onward first, then</text>
<text x="44" y="839" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">redirect the predecessor.</text>
</svg>
