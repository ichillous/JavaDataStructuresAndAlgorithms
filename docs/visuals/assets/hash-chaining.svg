<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 980" width="520" height="980" role="img" aria-labelledby="title desc">
<title id="title">05  Hash collisions: keep both keys</title>
<desc id="desc">Equal hash codes select one bucket; key equality still decides a match.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="hash-chaining-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="hash-chaining-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="hash-chaining-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="hash-chaining-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="hash-chaining-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="hash-chaining-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="hash-chaining-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="hash-chaining-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="hash-chaining-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="hash-chaining-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="980" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">05  Hash collisions: keep both keys</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Linear structures · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="151" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1  Distinct keys, equal hash codes</text>
<rect x="52" y="180" width="168" height="62" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="136" y="219" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">&quot;Aa&quot;</text>
<line x1="136" y1="248" x2="136" y2="280" stroke="#2451b7" stroke-width="2.5" marker-end="url(#hash-chaining-blue-arrow)"/>
<text x="136" y="315" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">hash = 2112</text>
<rect x="300" y="180" width="168" height="62" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="384" y="219" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">&quot;BB&quot;</text>
<line x1="384" y1="248" x2="384" y2="280" stroke="#2451b7" stroke-width="2.5" marker-end="url(#hash-chaining-blue-arrow)"/>
<text x="384" y="315" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">hash = 2112</text>
<text x="260" y="358" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">floorMod(2112, 4) = 0</text>
<text x="28" y="403" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2  One bucket, two separate mappings</text>
<rect x="52" y="434" width="88" height="50" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="96" y="466" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">0</text>
<rect x="52" y="500" width="88" height="50" rx="8" fill="#f6f8fb" stroke="#8994a5" stroke-width="2"/>
<text x="96" y="532" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1 empty</text>
<rect x="52" y="566" width="88" height="50" rx="8" fill="#f6f8fb" stroke="#8994a5" stroke-width="2"/>
<text x="96" y="598" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2 empty</text>
<rect x="52" y="632" width="88" height="50" rx="8" fill="#f6f8fb" stroke="#8994a5" stroke-width="2"/>
<text x="96" y="664" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3 empty</text>
<line x1="148" y1="459" x2="190" y2="459" stroke="#2451b7" stroke-width="2.5" marker-end="url(#hash-chaining-blue-arrow)"/>
<rect x="200" y="434" width="180" height="50" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="290" y="467" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">key = &quot;BB&quot;</text>
<text x="402" y="467" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">head</text>
<line x1="290" y1="491" x2="290" y2="546" stroke="#2451b7" stroke-width="2.5" marker-end="url(#hash-chaining-blue-arrow)"/>
<rect x="200" y="556" width="180" height="50" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="290" y="589" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">key = &quot;Aa&quot;</text>
<text x="402" y="589" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">next</text>
<line x1="290" y1="614" x2="290" y2="667" stroke="#2451b7" stroke-width="2.5" marker-end="url(#hash-chaining-blue-arrow)"/>
<text x="290" y="697" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">null: end of chain</text>
<text x="28" y="742" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Lookup checks equality along the chain.</text>
<rect x="28" y="780" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="811" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="840" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A shared hash only selects a bucket.</text>
<text x="44" y="867" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Equality still distinguishes the</text>
<text x="44" y="894" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">mappings; a collision must preserve</text>
<text x="44" y="921" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">both.</text>
</svg>
