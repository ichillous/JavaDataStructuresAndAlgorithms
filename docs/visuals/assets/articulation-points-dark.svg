<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 896" width="520" height="896" role="img" aria-labelledby="title desc">
<title id="title">27  Articulation points</title>
<desc id="desc">A bowtie graph of two triangles sharing vertex 2 is searched depth-first from 0 with discovery and low values shown, and removing vertex 2 leaves the separate components {0, 1} and {3, 4}.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="articulation-points-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="articulation-points-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="articulation-points-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="articulation-points-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="articulation-points-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="articulation-points-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="articulation-points-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="articulation-points-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="articulation-points-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="articulation-points-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="articulation-points-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="articulation-points-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="articulation-points-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="articulation-points-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="articulation-points-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="896" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">27  Articulation points</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Graphs · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">DFS from 0: disc (d) and low (l)</text>
<line x1="140.0" y1="254.0" x2="140.0" y2="290.0" stroke="#9cbcff" stroke-width="2.5"/>
<line x1="164.41" y1="307.05" x2="235.59" y2="280.95" stroke="#9cbcff" stroke-width="2.5"/>
<line x1="235.59" y1="263.05" x2="164.41" y2="236.95" stroke="#8291aa" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="284.41" y1="263.05" x2="355.59" y2="236.95" stroke="#9cbcff" stroke-width="2.5"/>
<line x1="380.0" y1="254.0" x2="380.0" y2="290.0" stroke="#9cbcff" stroke-width="2.5"/>
<line x1="355.59" y1="307.05" x2="284.41" y2="280.95" stroke="#8291aa" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="140" cy="228" r="22" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="140" y="235" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">0</text>
<text x="112" y="234" font-size="18" fill="#bec9da" text-anchor="end" font-weight="700">d1 l1</text>
<circle cx="140" cy="316" r="22" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="140" y="323" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">1</text>
<text x="112" y="322" font-size="18" fill="#bec9da" text-anchor="end" font-weight="700">d2 l1</text>
<circle cx="260" cy="272" r="22" fill="#302a18" stroke="#f4cf70" stroke-width="3"/>
<text x="260" y="279" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">2</text>
<text x="260" y="242" font-size="18" fill="#f4cf70" text-anchor="middle" font-weight="700">d3 l1</text>
<circle cx="380" cy="228" r="22" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="380" y="235" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="408" y="234" font-size="18" fill="#bec9da" text-anchor="start" font-weight="700">d4 l3</text>
<circle cx="380" cy="316" r="22" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="380" y="323" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">4</text>
<text x="408" y="322" font-size="18" fill="#bec9da" text-anchor="start" font-weight="700">d5 l3</text>
<text x="28" y="366" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">solid: DFS tree edge   dashed: back edge</text>
<circle cx="42" cy="399" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="405" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="406" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">low(3) = 3 &gt;= disc(2) = 3</text>
<text x="66" y="432" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">Child 3 cannot climb above 2: 2 cuts the graph.</text>
<circle cx="42" cy="465" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="471" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="472" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Remove 2: two components remain</text>
<line x1="140.0" y1="578.0" x2="140.0" y2="614.0" stroke="#8291aa" stroke-width="2.5"/>
<line x1="380.0" y1="578.0" x2="380.0" y2="614.0" stroke="#8291aa" stroke-width="2.5"/>
<circle cx="140" cy="552" r="22" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="140" y="559" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">0</text>
<circle cx="140" cy="640" r="22" fill="#203455" stroke="#9cbcff" stroke-width="3"/>
<text x="140" y="647" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<circle cx="260" cy="596" r="22" fill="#3d1f22" stroke="#ffaaa1" stroke-width="3"/>
<text x="260" y="603" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">2</text>
<circle cx="380" cy="552" r="22" fill="#2a2346" stroke="#cdb6ff" stroke-width="3"/>
<text x="380" y="559" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">3</text>
<circle cx="380" cy="640" r="22" fill="#2a2346" stroke="#cdb6ff" stroke-width="3"/>
<text x="380" y="647" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">4</text>
<text x="260" y="566" font-size="18" fill="#ffaaa1" text-anchor="middle" font-weight="700">removed</text>
<path d="M 118 668 Q 118 676 126 676 H 132.0 Q 140.0 676 140.0 684 Q 140.0 676 148.0 676 H 154 Q 162 676 162 668" fill="none" stroke="#9cbcff" stroke-width="2"/>
<text x="140.0" y="704" font-size="18" fill="#9cbcff" text-anchor="middle" font-weight="700">{0, 1}</text>
<path d="M 358 668 Q 358 676 366 676 H 372.0 Q 380.0 676 380.0 684 Q 380.0 676 388.0 676 H 394 Q 402 676 402 668" fill="none" stroke="#cdb6ff" stroke-width="2"/>
<text x="380.0" y="704" font-size="18" fill="#cdb6ff" text-anchor="middle" font-weight="700">{3, 4}</text>
<rect x="28" y="726" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="62" y="742" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">articulation point</text>
<rect x="235.2" y="726" width="26" height="20" rx="4" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="269.2" y="742" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">removed vertex</text>
<rect x="28" y="764" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="795" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="824" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">An articulation point has a child whose</text>
<text x="44" y="851" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">low is at least its own disc.</text>
</svg>
