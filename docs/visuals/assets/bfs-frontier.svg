<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1110" width="520" height="1110" role="img" aria-labelledby="title desc">
<title id="title">22  BFS: discovered vs processed</title>
<desc id="desc">Follow the queue separately from discovery; isolate unreachable vertex 5.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="bfs-frontier-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="bfs-frontier-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="bfs-frontier-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="bfs-frontier-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="bfs-frontier-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="bfs-frontier-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="bfs-frontier-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="bfs-frontier-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="bfs-frontier-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="bfs-frontier-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1110" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">22  BFS: discovered vs processed</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Graphs · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="153" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">UNDIRECTED GRAPH · source 0</text>
<line x1="259.5140992107366" y1="239.58308094711603" x2="202.4064539882568" y2="308.1122552140919" stroke="#8994a5" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="302.62741699796953" y1="237.62741699796953" x2="375.25126265847086" y2="310.25126265847086" stroke="#2451b7" stroke-width="4"/>
<line x1="180.0" y1="367.0" x2="180.0" y2="420.0" stroke="#8994a5" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="400.0" y1="367.0" x2="400.0" y2="420.0" stroke="#2451b7" stroke-width="4"/>
<line x1="212.0" y1="455.0" x2="365.0" y2="455.0" stroke="#8994a5" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="280" cy="215" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="280" y="222" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">0</text>
<circle cx="180" cy="335" r="27" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="180" y="342" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<circle cx="400" cy="335" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="400" y="342" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<circle cx="180" cy="455" r="27" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="180" y="462" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<circle cx="400" cy="455" r="27" fill="#edf2fc" stroke="#2451b7" stroke-width="3"/>
<text x="400" y="462" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">4</text>
<circle cx="70" cy="215" r="27" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="70" y="222" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">5</text>
<text x="70" y="265" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">isolated</text>
<text x="28" y="510" font-size="20" fill="#2451b7" text-anchor="start" font-weight="400">Thick lines: path 0 → 2 → 4</text>
<rect x="28" y="540" width="464" height="174" rx="8" fill="#f6f8fb" stroke="#8994a5" stroke-width="2"/>
<text x="44" y="573" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">After processing vertex 1</text>
<text x="44" y="625" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Queue front → back</text>
<rect x="285" y="596" width="72" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="321.0" y="627" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<rect x="369" y="596" width="72" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="405.0" y="627" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="44" y="674" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">2 is next; 3 is discovered, still queued.</text>
<text x="28" y="755" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Discovery / enqueue order</text>
<rect x="28" y="774" width="76" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="66.0" y="805" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<rect x="120" y="774" width="76" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="158.0" y="805" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<rect x="212" y="774" width="76" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="250.0" y="805" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<rect x="304" y="774" width="76" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="805" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<rect x="396" y="774" width="76" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="434.0" y="805" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">4</text>
<text x="28" y="866" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Processing order: 0 → 1 → 2 → 3 → 4</text>
<rect x="28" y="904" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="935" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="964" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Mark a vertex when it enters the queue.</text>
<text x="44" y="991" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Discovering it does not mean it has</text>
<text x="44" y="1018" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">been processed; vertex 5 is never</text>
<text x="44" y="1045" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">reached.</text>
</svg>
