<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" width="520" height="800" role="img" aria-labelledby="title desc">
<title id="title">01  Array insertion: make a gap</title>
<desc id="desc">Shift the suffix before writing the new value into the live array.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="array-insertion-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="array-insertion-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="array-insertion-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="array-insertion-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="array-insertion-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="array-insertion-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="array-insertion-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="array-insertion-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="array-insertion-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="array-insertion-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="800" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">01  Array insertion: make a gap</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Linear structures · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="151" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1  Before: size = 2</text>
<rect x="100" y="180" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="148.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<text x="148.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="212" y="180" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">30</text>
<text x="260.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="324" y="180" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="372.0" y="211" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">free</text>
<text x="372.0" y="254" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<text x="28" y="286" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2  Shift right: index 1 → 2</text>
<line x1="260" y1="316" x2="372" y2="316" stroke="#2451b7" stroke-width="2.5" marker-end="url(#array-insertion-blue-arrow)"/>
<rect x="100" y="342" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="148.0" y="373" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<text x="148.0" y="416" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="212" y="342" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260.0" y="373" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">30</text>
<text x="260.0" y="416" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="324" y="342" width="96" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="372.0" y="373" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30</text>
<text x="372.0" y="416" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="212" y="342" width="96" height="48" rx="8" fill="none" stroke="#bd3026" stroke-width="2" stroke-dasharray="6 5"/>
<text x="260" y="448" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">old copy: still here</text>
<text x="28" y="486" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3  Write 20, then size becomes 3</text>
<rect x="100" y="514" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="148.0" y="545" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<text x="148.0" y="588" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="212" y="514" width="96" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260.0" y="545" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">20</text>
<text x="260.0" y="588" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="324" y="514" width="96" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="372.0" y="545" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">30</text>
<text x="372.0" y="588" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="28" y="628" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="659" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="688" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Move the suffix right to left before</text>
<text x="44" y="715" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">writing the new value. Otherwise an</text>
<text x="44" y="742" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">unread value can be overwritten.</text>
</svg>
