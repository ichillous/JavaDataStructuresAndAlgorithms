<rect x="28" y="690" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="721" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="750" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">A graph is two-colourable exactly when</text>
<text x="44" y="777" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">it has no odd cycle; the first edge</text>
<text x="44" y="804" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">joining equal colours exposes one.</text>
