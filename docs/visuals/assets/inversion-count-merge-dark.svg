<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 892" width="520" height="892" role="img" aria-labelledby="title desc">
<title id="title">77  Inversions during a merge</title>
<desc id="desc">countInversions on 2, 4, 1, 3, 5 merges the sorted halves 2, 4 and 1, 3, 5: emitting 1 jumps over two left values, emitting 3 jumps over one, and the other values add nothing, for 3 inversions.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="inversion-count-merge-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="inversion-count-merge-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="inversion-count-merge-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="inversion-count-merge-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="inversion-count-merge-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="inversion-count-merge-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="inversion-count-merge-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="inversion-count-merge-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="inversion-count-merge-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="inversion-count-merge-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker><marker id="inversion-count-merge-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#86dca2"/></marker><marker id="inversion-count-merge-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#173527"/></marker><marker id="inversion-count-merge-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#cdb6ff"/></marker><marker id="inversion-count-merge-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2a2346"/></marker><marker id="inversion-count-merge-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3d1f22"/></marker></defs>
<rect x="0" y="0" width="520" height="892" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">77  Inversions during a merge</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Array patterns · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Sorted halves, 0 pairs inside each</text>
<rect x="39" y="178" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="63.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">2</text>
<rect x="93" y="178" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="117.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">4</text>
<rect x="193" y="178" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="217.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">1</text>
<rect x="247" y="178" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="271.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<rect x="301" y="178" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="325.0" y="209.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">5</text>
<path d="M 39 230 Q 39 238 47 238 H 82.0 Q 90.0 238 90.0 246 Q 90.0 238 98.0 238 H 133 Q 141 238 141 230" fill="none" stroke="#bec9da" stroke-width="2"/>
<text x="90.0" y="266" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="700">left half</text>
<path d="M 193 230 Q 193 238 201 238 H 263.0 Q 271.0 238 271.0 246 Q 271.0 238 279.0 238 H 341 Q 349 238 349 230" fill="none" stroke="#bec9da" stroke-width="2"/>
<text x="271.0" y="266" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="700">right half</text>
<circle cx="42" cy="297" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="303" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="304" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Emit 1: it jumps over 2 and 4</text>
<rect x="39" y="326" width="48" height="48" rx="8" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="63.0" y="357.0" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">2</text>
<rect x="93" y="326" width="48" height="48" rx="8" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="117.0" y="357.0" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">4</text>
<rect x="193" y="326" width="48" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="217.0" y="357.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<rect x="247" y="326" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="271.0" y="357.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<rect x="301" y="326" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="325.0" y="357.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">5</text>
<text x="39" y="402" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">+2: pairs (2, 1) and (4, 1)</text>
<circle cx="42" cy="435" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="441" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="442" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Emit 3: it jumps over 4</text>
<rect x="39" y="464" width="48" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="63.0" y="495.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">2</text>
<rect x="93" y="464" width="48" height="48" rx="8" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="117.0" y="495.0" font-size="20" fill="#ffaaa1" text-anchor="middle" font-weight="700">4</text>
<rect x="193" y="464" width="48" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="217.0" y="495.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">1</text>
<rect x="247" y="464" width="48" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="271.0" y="495.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">3</text>
<rect x="301" y="464" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="325.0" y="495.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">5</text>
<text x="39" y="540" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">+1: pair (4, 3); emitting 2 added 0</text>
<circle cx="42" cy="573" r="14" fill="#9cbcff" stroke="#9cbcff" stroke-width="2"/>
<text x="42" y="579" font-size="18" fill="#111827" text-anchor="middle" font-weight="700">4</text>
<text x="66" y="580" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Added as each value is emitted</text>
<rect x="39" y="602" width="48" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="63.0" y="633.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">1</text>
<text x="63.0" y="676" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">+2</text>
<rect x="93" y="602" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="117.0" y="633.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">2</text>
<text x="117.0" y="676" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">+0</text>
<rect x="147" y="602" width="48" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="171.0" y="633.0" font-size="20" fill="#9cbcff" text-anchor="middle" font-weight="700">3</text>
<text x="171.0" y="676" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">+1</text>
<rect x="201" y="602" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="225.0" y="633.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">4</text>
<text x="225.0" y="676" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">+0</text>
<rect x="255" y="602" width="48" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="279.0" y="633.0" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">5</text>
<text x="279.0" y="676" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">+0</text>
<text x="39" y="702" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">2 + 0 + 1 + 0 + 0 = 3 cross inversions</text>
<rect x="28" y="722" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="738" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">from the right</text>
<rect x="207.55200000000002" y="722" width="26" height="20" rx="4" fill="#3d1f22" stroke="#ffaaa1" stroke-width="2"/>
<text x="241.55200000000002" y="738" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">jumped over</text>
<rect x="373.28000000000003" y="722" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="407.28000000000003" y="738" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">emitted</text>
<rect x="28" y="762" width="464" height="109" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="793" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="822" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">A smaller right value jumps over every</text>
<text x="44" y="849" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">left value still waiting.</text>
</svg>
