<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 808" width="520" height="808" role="img" aria-labelledby="title desc">
<title id="title">52  Data structures by question</title>
<desc id="desc">9 cards sort the structures by the question they answer. Each card shows a small pictogram, names the family, a method to start with and the folder to open: by position, DynamicArray.get, arrays/ and linked-lists/; by arrival, ArrayQueue.dequeue, stacks/ and queues/; by key, ChainedHashMap.get, hash-tables/; by order, RedBlackTreeMap.floorKey, trees/; by priority, BinaryMinHeap.remove, heaps/; by prefix, Trie.wordsWithPrefix, tries/; by range, FenwickTree.rangeSum, range-queries/; by connectivity, UnionFind.connected, union-find/ and graphs/; approximately, BloomFilter.mightContain, probabilistic/.</desc>
