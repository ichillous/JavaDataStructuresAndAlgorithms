<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 815" width="520" height="815" role="img" aria-labelledby="title desc">
<title id="title">52  Data structures by question</title>
<desc id="desc">9 cards sort the structures by the question they answer. Each card shows a small pictogram, names the family, a method to start with and the folder to open: by position, DynamicArray.get, arrays/ and linked-lists/; by arrival, RingDeque.removeFirst, stacks/ and queues/; by key, ChainedHashMap.get, hash-tables/; by order, RedBlackTreeMap.floorKey, trees/; by priority, BinaryMinHeap.remove, heaps/; by prefix, Trie.wordsWithPrefix, tries/; by range, FenwickTree.rangeSum, range-queries/; by connectivity, UnionFind.find, union-find/ and graphs/; approximately, BloomFilter.mightContain, probabilistic/.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
