<text x="66" y="436" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">Walk back from the corner: GCT</text>
<text x="66" y="464" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">A ≠ T: up 3 ≥ left 3, go up</text>
<text x="66" y="492" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">T = T: take T, go diagonally</text>
<text x="66" y="520" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">C ≠ A: up 1 &lt; left 2, go left</text>
<text x="66" y="548" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">C = C: take C, go diagonally</text>
<text x="66" y="576" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">G = G: take G, go diagonally</text>
<rect x="28" y="598" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="614" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">letter taken</text>
<rect x="185.952" y="598" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="219.952" y="614" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">differ: move up or left</text>
<rect x="28" y="630" width="26" height="20" rx="4" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="62" y="646" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">stop at row 0</text>
<rect x="28" y="670" width="464" height="163" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="701" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="730" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">The traceback re-derives each choice</text>
<text x="44" y="757" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">from the table: take equal letters,</text>
<text x="44" y="784" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">otherwise move toward the larger</text>
<text x="44" y="811" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">neighbour, and go up on a tie.</text>
