<text x="45" y="1055" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Blue: changed ancestors and leaf</text>
<text x="45" y="1100" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">min [1,4) = min(9,5) = 5</text>
<text x="45" y="1140" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Pad unused leaves with MAX_VALUE.</text>
<rect x="28" y="1185" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="1216" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1245" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Each node covers an adjacent interval.</text>
<text x="44" y="1272" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A point set repairs one path to the</text>
<text x="44" y="1299" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">root.</text>
</svg>
