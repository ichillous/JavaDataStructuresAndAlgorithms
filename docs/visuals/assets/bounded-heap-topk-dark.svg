<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img" aria-labelledby="title desc">
<title id="title">36  Top k with a bounded heap</title>
<desc id="desc">Selection.smallestK over the stream 8, 3, 9, 5, 2, 5, 1 with k = 3 fills the heap with 8, 3, 9, then evicts 9, evicts 8, drops the second 5 and evicts 5 for 1, ending with 1, 2, 3.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
