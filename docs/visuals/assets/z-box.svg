<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 865" width="520" height="865" role="img" aria-labelledby="title desc">
<title id="title">91  Z-array and the Z-box</title>
<desc id="desc">The Z-array of aabxaabxaab is 11, 1, 0, 0, 7, 1, 0, 0, 3, 1, 0; the match at index 4 is a Z-box [4, 11), index 5 copies z[1] = 1 from it, and index 8 starts at 3 because z[4] = 7 overruns the box.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
