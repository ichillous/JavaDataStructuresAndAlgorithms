<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1065" width="520" height="1065" role="img" aria-labelledby="title desc">
<title id="title">16  Coin change: build an optimum</title>
<desc id="desc">Compare every final coin; the largest-first greedy choice loses.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="coin-dp-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="coin-dp-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="coin-dp-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="coin-dp-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="coin-dp-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="coin-dp-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="coin-dp-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="coin-dp-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="coin-dp-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="coin-dp-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1065" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">16  Coin change: build an optimum</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Algorithm traces · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Coins: 1, 3, 4; target = 6</text>
<text x="28" y="200" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Minimum coins for each exact amount:</text>
<rect x="50.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="74.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="74.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="112.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="136.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<text x="136.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="174.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="198.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="198.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="236.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<text x="260.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="298.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="322.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<text x="322.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<rect x="360.0" y="225" width="48" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="384.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="384.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="422.0" y="225" width="48" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="446.0" y="256" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">2</text>
<text x="446.0" y="299" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">6</text>
<text x="28" y="330" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">Bottom labels are amounts, not coin values.</text>
<rect x="28" y="365" width="464" height="230" rx="8" fill="#f6f8fb" stroke="#8994a5" stroke-width="2"/>
<text x="44" y="403" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">To fill best[6], try each coin:</text>
<text x="50" y="449" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">coin 1: best[5] + 1 = 3</text>
<rect x="40" y="469" width="440" height="40" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="50" y="498" font-size="20" fill="#2451b7" text-anchor="start" font-weight="400">coin 3: best[3] + 1 = 2</text>
<text x="50" y="547" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">coin 4: best[2] + 1 = 3</text>
<text x="28" y="644" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">best[6] = min(3, 2, 3) = 2</text>
<text x="28" y="683" font-size="20" fill="#2451b7" text-anchor="start" font-weight="400">Optimal witness: 3 + 3</text>
<rect x="28" y="720" width="464" height="100" rx="8" fill="#ffffff" stroke="#bd3026" stroke-width="2" stroke-dasharray="6 5"/>
<text x="44" y="753" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">Greedy: 4 + 1 + 1 uses 3 coins.</text>
<text x="44" y="788" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">Feasible, but not optimal.</text>
<rect x="28" y="860" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="891" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="920" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">best[a] is optimal for exactly amount</text>
<text x="44" y="947" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">a. Each candidate adds one coin to a</text>
<text x="44" y="974" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">solved, strictly smaller amount.</text>
</svg>
