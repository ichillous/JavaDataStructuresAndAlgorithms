<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 904" width="520" height="904" role="img" aria-labelledby="title desc">
<title id="title">02  Unlinking a known list node</title>
<desc id="desc">Bypass the middle node in both directions, then clear its links.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="linked-unlink-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="linked-unlink-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="linked-unlink-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="linked-unlink-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="linked-unlink-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="linked-unlink-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="linked-unlink-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="linked-unlink-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="linked-unlink-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="linked-unlink-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="904" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">02  Unlinking a known list node</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Linear structures · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="151" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1  Before: remove node 20</text>
<text x="100" y="187" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">head</text>
<text x="420" y="187" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">tail</text>
<circle cx="100" cy="233" r="32" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="100" y="240" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">10</text>
<circle cx="260" cy="233" r="32" fill="#ffffff" stroke="#bd3026" stroke-width="2"/>
<text x="260" y="240" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">20</text>
<circle cx="420" cy="233" r="32" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="420" y="240" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30</text>
<line x1="142" y1="223" x2="218" y2="223" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<line x1="218" y1="243" x2="142" y2="243" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<line x1="302" y1="223" x2="378" y2="223" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<line x1="378" y1="243" x2="302" y2="243" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<text x="260" y="290" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="400">selected for removal</text>
<text x="28" y="342" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2  Repair both neighboring links</text>
<text x="52" y="380" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">10.next → 30</text>
<text x="52" y="414" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">30.previous → 10</text>
<text x="28" y="466" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3  After: size = 2</text>
<circle cx="100" cy="515" r="32" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="100" y="522" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">10</text>
<circle cx="420" cy="515" r="32" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="420" y="522" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">30</text>
<line x1="142" y1="505" x2="378" y2="505" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<line x1="378" y1="525" x2="142" y2="525" stroke="#2451b7" stroke-width="2.5" marker-end="url(#linked-unlink-blue-arrow)"/>
<text x="100" y="570" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">head</text>
<text x="420" y="570" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">tail</text>
<circle cx="260" cy="640" r="32" fill="#ffffff" stroke="#bd3026" stroke-width="2"/>
<text x="260" y="647" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">20</text>
<text x="260" y="696" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="400">Detached: previous = next = null</text>
<rect x="28" y="734" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="765" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="794" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Repair both neighbors, then detach the</text>
<text x="44" y="821" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">removed node. A forward link and its</text>
<text x="44" y="848" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">backward link must agree.</text>
</svg>
