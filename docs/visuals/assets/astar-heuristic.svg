<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 840" width="520" height="840" role="img" aria-labelledby="title desc">
<title id="title">33  A* with a good heuristic</title>
<desc id="desc">A* on a 5 by 5 unit grid from cell 10 to cell 14 with the Manhattan heuristic: the route 10, 11, 12, 13, 14 has f = g + h equal to 4 everywhere, the heuristic was called for 13 of 25 cells, and with h = 0 it was called for 21.</desc>
