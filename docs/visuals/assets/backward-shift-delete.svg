<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 875" width="520" height="875" role="img" aria-labelledby="title desc">
<title id="title">29  Backward-shift deletion</title>
<desc id="desc">In the cluster C, H, M, B at slots 3 to 6, clearing only H&#x27;s slot 4 would hide M, which is stored at slot 5 but starts its search at slot 4. Backward-shift deletion moves M to slot 4, clears slot 5 and leaves B at its home slot 6.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="backward-shift-delete-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="backward-shift-delete-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="backward-shift-delete-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="backward-shift-delete-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="backward-shift-delete-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="backward-shift-delete-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="backward-shift-delete-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="backward-shift-delete-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="backward-shift-delete-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="backward-shift-delete-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker><marker id="backward-shift-delete-green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1c6b3c"/></marker><marker id="backward-shift-delete-mint-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#e3f4e8"/></marker><marker id="backward-shift-delete-violet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b3fb8"/></marker><marker id="backward-shift-delete-lilac-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f0eafb"/></marker><marker id="backward-shift-delete-rose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fde9e7"/></marker></defs>
<rect x="0" y="0" width="520" height="875" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">29  Backward-shift deletion</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Hashing and sketches · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<circle cx="42" cy="149" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="155" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="66" y="156" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">A cluster: C, H, M, B</text>
<rect x="39" y="184" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="64.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="95" y="184" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="120.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="151" y="184" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="176.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="207" y="184" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="232.0" y="215.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">C</text>
<text x="232.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="263" y="184" width="50" height="48" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="288.0" y="215.0" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">H</text>
<text x="288.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<rect x="319" y="184" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="344.0" y="215.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">M</text>
<text x="344.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="375" y="184" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="400.0" y="215.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">B</text>
<text x="400.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">6</text>
<rect x="431" y="184" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="456.0" y="258" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">7</text>
<text x="39" y="284" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">Home slots: C 3, H 3, M 4, B 6</text>
<circle cx="42" cy="315" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="321" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="322" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Clear only slot 4 to remove H</text>
<line x1="288.0" y1="362" x2="288.0" y2="390" stroke="#bd3026" stroke-width="2.5" marker-end="url(#backward-shift-delete-red-arrow)"/>
<text x="288.0" y="354" font-size="18" fill="#bd3026" text-anchor="middle" font-weight="700">get(M) starts here</text>
<rect x="39" y="396" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="95" y="396" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="151" y="396" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="207" y="396" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="232.0" y="427.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">C</text>
<rect x="263" y="396" width="50" height="48" rx="8" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<rect x="319" y="396" width="50" height="48" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="344.0" y="427.0" font-size="20" fill="#8a5e00" text-anchor="middle" font-weight="700">M</text>
<rect x="375" y="396" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="400.0" y="427.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">B</text>
<rect x="431" y="396" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="39" y="468" font-size="18" fill="#bd3026" text-anchor="start" font-weight="700">Slot 4 is empty, so M is wrongly absent</text>
<circle cx="42" cy="499" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="505" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="506" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Shift M back instead</text>
<path d="M 344 550 Q 316 522 288 550" fill="none" stroke="#1c6b3c" stroke-width="2.5" marker-end="url(#backward-shift-delete-green-arrow)"/>
<rect x="39" y="556" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="95" y="556" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="151" y="556" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="207" y="556" width="50" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="232.0" y="587.0" font-size="20" fill="#2451b7" text-anchor="middle" font-weight="700">C</text>
<rect x="263" y="556" width="50" height="48" rx="8" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="288.0" y="587.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">M</text>
<rect x="319" y="556" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="375" y="556" width="50" height="48" rx="8" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="400.0" y="587.0" font-size="20" fill="#6b3fb8" text-anchor="middle" font-weight="700">B</text>
<rect x="431" y="556" width="50" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="39" y="628" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">M moves from slot 5 to 4; slot 5 is cleared</text>
<text x="39" y="656" font-size="18" fill="#6b3fb8" text-anchor="start" font-weight="700">B stays: it is already at its home slot 6</text>
<rect x="28" y="670" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="62" y="686" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">stored</text>
<rect x="141.024" y="670" width="26" height="20" rx="4" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="175.024" y="686" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">to remove</text>
<rect x="285.152" y="670" width="26" height="20" rx="4" fill="#fde9e7" stroke="#bd3026" stroke-width="2"/>
<text x="319.152" y="686" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">hole</text>
<rect x="28" y="702" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="718" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">moved back</text>
<rect x="190.272" y="702" width="26" height="20" rx="4" fill="#f0eafb" stroke="#6b3fb8" stroke-width="2"/>
<text x="224.272" y="718" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">left in place</text>
<rect x="350.816" y="702" width="26" height="20" rx="4" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="384.816" y="718" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">empty</text>
<rect x="28" y="742" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="773" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="802" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Shifting later keys back keeps every</text>
<text x="44" y="829" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">key reachable.</text>
</svg>
