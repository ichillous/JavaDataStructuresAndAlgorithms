<text x="195.0" y="443.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">31</text>
<text x="195.0" y="486" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=3</text>
<rect x="231" y="412" width="56" height="48" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="259.0" y="443.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">35</text>
<text x="259.0" y="486" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=3</text>
<rect x="295" y="412" width="56" height="48" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="323.0" y="443.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">15</text>
<text x="323.0" y="486" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=1</text>
<rect x="359" y="412" width="56" height="48" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="387.0" y="443.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">25</text>
<text x="387.0" y="486" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=2</text>
<text x="39" y="514" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">ties keep the previous order:</text>
<rect x="39" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="67.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">15</text>
<rect x="103" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="131.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">21</text>
<rect x="167" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="195.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">25</text>
<rect x="231" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="259.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">31</text>
<rect x="295" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="323.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">35</text>
<rect x="359" y="524" width="56" height="48" rx="8" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="387.0" y="555.0" font-size="20" fill="#86dca2" text-anchor="middle" font-weight="700">41</text>
<rect x="28" y="586" width="26" height="20" rx="4" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="62" y="602" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">digit being read</text>
<rect x="223.104" y="586" width="26" height="20" rx="4" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
<text x="257.10400000000004" y="602" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">after the ones pass</text>
<rect x="28" y="618" width="26" height="20" rx="4" fill="#173527" stroke="#86dca2" stroke-width="2"/>
<text x="62" y="634" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">after the tens pass</text>
<text x="28" y="664" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">Base 10 shown; radixSort uses 8-bit digits.</text>
<rect x="28" y="684" width="464" height="190" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="715" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="744" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Radix sort orders by the least</text>
<text x="44" y="771" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">significant digit first; because every</text>
<text x="44" y="798" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">pass is stable, ties keep the earlier</text>
<text x="44" y="825" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">order and the last pass leaves a full</text>
<text x="44" y="852" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">sort.</text>
</svg>
