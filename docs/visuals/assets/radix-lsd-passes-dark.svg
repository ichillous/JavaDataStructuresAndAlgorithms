<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 898" width="520" height="898" role="img" aria-labelledby="title desc">
<title id="title">47  Radix passes by digit</title>
<desc id="desc">Sorting 35, 21, 41, 15, 31, 25 by the ones digit gives 21, 41, 31, 35, 15, 25; a stable pass on the tens digit then gives 15, 21, 25, 31, 35, 41.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
