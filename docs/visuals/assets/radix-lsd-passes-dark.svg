<text x="39" y="284" font-size="18" fill="#bec9da" text-anchor="start" font-weight="400">ties keep input order:</text>
<rect x="39" y="294" width="56" height="48" rx="8" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
<text x="67.0" y="325.0" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">21</text>
<rect x="103" y="294" width="56" height="48" rx="8" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
