<text x="131.0" y="443.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">41</text>
<text x="131.0" y="486" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=4</text>
