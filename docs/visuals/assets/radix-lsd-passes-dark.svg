<text x="195.0" y="325.0" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">31</text>
<rect x="231" y="294" width="56" height="48" rx="8" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
<text x="259.0" y="325.0" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">35</text>
