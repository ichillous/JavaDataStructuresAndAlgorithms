<text x="195.0" y="213.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">41</text>
<text x="195.0" y="256" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=1</text>
<rect x="231" y="182" width="56" height="48" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="259.0" y="213.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">15</text>
<text x="259.0" y="256" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=5</text>
<rect x="295" y="182" width="56" height="48" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="323.0" y="213.0" font-size="20" fill="#f4cf70" text-anchor="middle" font-weight="700">31</text>
<text x="323.0" y="256" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">d=1</text>
