<rect x="359" y="294" width="56" height="48" rx="8" fill="#2a2346" stroke="#cdb6ff" stroke-width="2"/>
<text x="387.0" y="325.0" font-size="20" fill="#cdb6ff" text-anchor="middle" font-weight="700">25</text>
