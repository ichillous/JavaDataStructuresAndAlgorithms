<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 873" width="520" height="873" role="img" aria-labelledby="title desc">
<title id="title">53  Algorithms by task</title>
<desc id="desc">9 cards sort the algorithms by the task they perform. Each card names the family, a method to start with and the folder to open: search, SearchAlgorithms.lowerBound, searching/ and array-patterns/; sort, SortAlgorithms.mergeSort, sorting/ and divide-and-conquer/; select, Selection.kthSmallest, searching/; traverse, GraphAlgorithms.breadthFirst, graph/; shortest path, GraphAlgorithms.dijkstra, graph/; connect, FlowNetwork.maxFlow, graph/; optimize, DynamicProgramming.knapsack01, dynamic-programming/ and greedy/ and backtracking/; match text, StringAlgorithms.kmpFindAll, strings/; compute, NumberTheory.modPow, math/ and bit-manipulation/.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
