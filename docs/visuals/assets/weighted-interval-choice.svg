<text x="446" y="296" font-size="18" fill="#505b6b" text-anchor="start" font-weight="700">p=2</text>
<text x="62" y="328" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<text x="106" y="328" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
