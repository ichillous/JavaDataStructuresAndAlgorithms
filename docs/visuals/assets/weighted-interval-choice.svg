<text x="414" y="328" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">8</text>
<circle cx="42" cy="347" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="353" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="354" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">take = w + best[p] or skip = best[i-1]</text>
<text x="150.0" y="398" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">p</text>
<text x="214.0" y="398" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">take</text>
<text x="278.0" y="398" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">skip</text>
<text x="342.0" y="398" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">best</text>
<text x="106" y="433.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">A</text>
