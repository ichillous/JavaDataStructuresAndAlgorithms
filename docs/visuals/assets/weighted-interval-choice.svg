<rect x="310" y="410" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="434.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="106" y="467.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">B</text>
<rect x="118" y="444" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="150.0" y="468.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<rect x="182" y="444" width="64" height="34" rx="3" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="214.0" y="468.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">6</text>
<rect x="246" y="444" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="278.0" y="468.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="310" y="444" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="468.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">6</text>
<text x="106" y="501.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">C</text>
<rect x="118" y="478" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="150.0" y="502.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<rect x="182" y="478" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="214.0" y="502.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="246" y="478" width="64" height="34" rx="3" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="278.0" y="502.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">6</text>
<rect x="310" y="478" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="502.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">6</text>
<text x="106" y="535.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">D</text>
<rect x="118" y="512" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="150.0" y="536.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<rect x="182" y="512" width="64" height="34" rx="3" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="214.0" y="536.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">10</text>
<rect x="246" y="512" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="278.0" y="536.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">6</text>
<rect x="310" y="512" width="64" height="34" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="536.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<circle cx="42" cy="577" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="583" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="584" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Walk back</text>
<rect x="300" y="570" width="188" height="30" rx="15" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="394.0" y="591" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">chosen B + D = 10</text>
<text x="66" y="612" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">D: best 10 ≠ 6, take, jump to p = 2</text>
<text x="66" y="640" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">B: best 6 ≠ 3, take, jump to p = 0</text>
<rect x="28" y="662" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="678" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">winning option</text>
<rect x="215.32799999999997" y="662" width="26" height="20" rx="4" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="249.32799999999997" y="678" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">losing option</text>
<rect x="28" y="702" width="464" height="163" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="733" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="762" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">For each interval by end time, compare</text>
<text x="44" y="789" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">skipping it with taking it plus the</text>
<text x="44" y="816" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">best schedule that ends before it</text>
<text x="44" y="843" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">starts.</text>
</svg>
