<text x="278.0" y="471.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="310" y="448" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="471.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">6</text>
<text x="106" y="502.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">C</text>
<rect x="118" y="480" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="150.0" y="503.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<rect x="182" y="480" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="214.0" y="503.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">5</text>
<rect x="246" y="480" width="64" height="32" rx="3" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="278.0" y="503.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">6</text>
<rect x="310" y="480" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="503.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">6</text>
<text x="106" y="534.0" font-size="18" fill="#505b6b" text-anchor="end" font-weight="400">D</text>
<rect x="118" y="512" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="150.0" y="535.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<rect x="182" y="512" width="64" height="32" rx="3" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="214.0" y="535.0" font-size="20" fill="#1c6b3c" text-anchor="middle" font-weight="700">10</text>
<rect x="246" y="512" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="278.0" y="535.0" font-size="20" fill="#505b6b" text-anchor="middle" font-weight="400">6</text>
<rect x="310" y="512" width="64" height="32" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="342.0" y="535.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">10</text>
<circle cx="42" cy="571" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="577" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="578" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Walk back</text>
<rect x="300" y="564" width="188" height="30" rx="15" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="394.0" y="585" font-size="18" fill="#1c6b3c" text-anchor="middle" font-weight="700">chosen B + D = 10</text>
<text x="66" y="614" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">D: best 10 ≠ 6, take, jump to p = 2</text>
<text x="66" y="642" font-size="18" fill="#1c6b3c" text-anchor="start" font-weight="700">B: best 6 ≠ 3, take, jump to p = 0</text>
<rect x="28" y="664" width="26" height="20" rx="4" fill="#e3f4e8" stroke="#1c6b3c" stroke-width="2"/>
<text x="62" y="680" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">winning option</text>
<rect x="215.32799999999997" y="664" width="26" height="20" rx="4" fill="#ffffff" stroke="#8994a5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="249.32799999999997" y="680" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">losing option</text>
<rect x="28" y="704" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="735" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="764" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Take an interval only if its weight</text>
<text x="44" y="791" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">plus the best earlier compatible</text>
<text x="44" y="818" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">schedule beats skipping it.</text>
</svg>
