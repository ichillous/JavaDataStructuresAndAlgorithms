<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1170" width="520" height="1170" role="img" aria-labelledby="title desc">
<title id="title">17  0/1 knapsack: sweep backward</title>
<desc id="desc">Sweep capacities backward so an item cannot reuse itself.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="knapsack-state-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffffff"/></marker><marker id="knapsack-state-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#1f2430"/></marker><marker id="knapsack-state-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#505b6b"/></marker><marker id="knapsack-state-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8994a5"/></marker><marker id="knapsack-state-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2451b7"/></marker><marker id="knapsack-state-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#edf2fc"/></marker><marker id="knapsack-state-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#fff3c4"/></marker><marker id="knapsack-state-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a5e00"/></marker><marker id="knapsack-state-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bd3026"/></marker><marker id="knapsack-state-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f6f8fb"/></marker></defs>
<rect x="0" y="0" width="520" height="1170" rx="16" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#1f2430" text-anchor="start" font-weight="700">17  0/1 knapsack: sweep backward</text>
<text x="28" y="74" font-size="20" fill="#505b6b" text-anchor="start" font-weight="400">Algorithm traces · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8994a5" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">0/1 items: (weight, value)</text>
<text x="28" y="190" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">A=(2, 3)  B=(3, 4)  capacity=4</text>
<text x="28" y="234" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">Before any item; bottom labels are capacity.</text>
<rect x="57.0" y="258" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="92.0" y="289" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="332" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="258" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="176.0" y="289" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="332" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="258" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260.0" y="289" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="260.0" y="332" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="258" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="344.0" y="289" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="344.0" y="332" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="258" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="428.0" y="289" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="428.0" y="332" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<text x="28" y="378" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">After A: sweep capacity 4 → 2</text>
<rect x="57.0" y="402" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="92.0" y="433" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="476" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="402" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="176.0" y="433" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="476" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="402" width="70" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="260.0" y="433" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="260.0" y="476" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="402" width="70" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="344.0" y="433" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="344.0" y="476" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="402" width="70" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="428.0" y="433" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">3</text>
<text x="428.0" y="476" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<line x1="428.0" y1="505" x2="260.0" y2="505" stroke="#2451b7" stroke-width="2.5" marker-end="url(#knapsack-state-blue-arrow)"/>
<text x="28" y="545" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Read best[c-2] from previous items.</text>
<text x="28" y="605" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">After B: sweep capacity 4 → 3</text>
<rect x="57.0" y="629" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="92.0" y="660" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="703" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="629" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="176.0" y="660" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="703" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="629" width="70" height="48" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="260.0" y="660" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="260.0" y="703" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="629" width="70" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="344.0" y="660" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">4</text>
<text x="344.0" y="703" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="629" width="70" height="48" rx="8" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="428.0" y="660" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">4</text>
<text x="428.0" y="703" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">4</text>
<line x1="428.0" y1="732" x2="344.0" y2="732" stroke="#2451b7" stroke-width="2.5" marker-end="url(#knapsack-state-blue-arrow)"/>
<text x="28" y="774" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">best[4] = max(3, best[1]+4) = 4</text>
<rect x="28" y="815" width="464" height="108" rx="8" fill="#ffffff" stroke="#bd3026" stroke-width="2" stroke-dasharray="6 5"/>
<text x="44" y="850" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">Ascending A would reuse the same item:</text>
<text x="44" y="887" font-size="20" fill="#bd3026" text-anchor="start" font-weight="400">best[4] = best[2] + 3 = 6 : invalid</text>
<rect x="28" y="965" width="464" height="136" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="996" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1025" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Descending capacity keeps the current</text>
<text x="44" y="1052" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">item out of its own predecessor states.</text>
<text x="44" y="1079" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Each item is used at most once.</text>
</svg>
