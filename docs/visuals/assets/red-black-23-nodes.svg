<text x="110" y="583" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="700">1</text>
<circle cx="180" cy="514" r="22" fill="#fde9e7" stroke="#bd3026" stroke-width="3"/>
<text x="180" y="521" font-size="20" fill="#bd3026" text-anchor="middle" font-weight="700">2</text>
