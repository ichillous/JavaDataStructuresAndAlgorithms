<text x="190.0" y="224.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">2</text>
<text x="66" y="260" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">1 →</text>
<text x="124" y="260" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">empty</text>
<text x="66" y="296" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">2 →</text>
