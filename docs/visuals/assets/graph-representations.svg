<rect x="124" y="506" width="44" height="30" rx="3" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="146.0" y="528.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">0</text>
