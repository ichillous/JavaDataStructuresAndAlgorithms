<text x="144.0" y="296.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">1</text>
<rect x="170" y="274" width="40" height="30" rx="8" fill="#ffffff" stroke="#8994a5" stroke-width="2"/>
<text x="190.0" y="296.0" font-size="20" fill="#1f2430" text-anchor="middle" font-weight="400">3</text>
<text x="66" y="332" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">3 →</text>
<text x="124" y="332" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">empty</text>
<circle cx="42" cy="371" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="377" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="66" y="378" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Adjacency matrix</text>
<text x="66" y="406" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">edge test O(1)  ·  neighbors O(V)</text>
<text x="146.0" y="434" font-size="18" fill="#505b6b" text-anchor="middle" font-weight="400">0</text>
