<text x="322" y="482" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">row = from</text>
<text x="322" y="510" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">column = to</text>
<circle cx="42" cy="591" r="14" fill="#2451b7" stroke="#2451b7" stroke-width="2"/>
<text x="42" y="597" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="66" y="598" font-size="20" fill="#1f2430" text-anchor="start" font-weight="700">Edge list</text>
<text x="66" y="626" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">edge test O(E)  ·  neighbors O(E)</text>
<rect x="66" y="640" width="62" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="97.0" y="661" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">0→1</text>
<rect x="136" y="640" width="65" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="168.5" y="661" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">0→2</text>
<rect x="209" y="640" width="61" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="239.5" y="661" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">2→1</text>
<rect x="278" y="640" width="64" height="30" rx="15" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="310.0" y="661" font-size="18" fill="#2451b7" text-anchor="middle" font-weight="700">2→3</text>
<rect x="28" y="682" width="26" height="20" rx="4" fill="#edf2fc" stroke="#2451b7" stroke-width="2"/>
<text x="62" y="698" font-size="18" fill="#1f2430" text-anchor="start" font-weight="400">1 = edge present, 0 = no edge</text>
<text x="28" y="728" font-size="18" fill="#505b6b" text-anchor="start" font-weight="400">deg = out-degree · V = vertices · E = edges</text>
<rect x="28" y="744" width="464" height="109" rx="8" fill="#fff3c4" stroke="#8a5e00" stroke-width="2"/>
<text x="44" y="775" font-size="18" fill="#8a5e00" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="804" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">Edge tests favor a matrix; neighbor</text>
<text x="44" y="831" font-size="20" fill="#1f2430" text-anchor="start" font-weight="400">scans favor an adjacency list.</text>
</svg>
