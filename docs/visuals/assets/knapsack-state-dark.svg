<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1170" width="520" height="1170" role="img" aria-labelledby="title desc">
<title id="title">17  0/1 knapsack: sweep backward</title>
<desc id="desc">Sweep capacities backward so an item cannot reuse itself.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="knapsack-state-paper-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#111827"/></marker><marker id="knapsack-state-ink-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#eef2f8"/></marker><marker id="knapsack-state-muted-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#bec9da"/></marker><marker id="knapsack-state-line-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8291aa"/></marker><marker id="knapsack-state-blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9cbcff"/></marker><marker id="knapsack-state-soft-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#203455"/></marker><marker id="knapsack-state-note-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#302a18"/></marker><marker id="knapsack-state-gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f4cf70"/></marker><marker id="knapsack-state-red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ffaaa1"/></marker><marker id="knapsack-state-panel-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#192333"/></marker></defs>
<rect x="0" y="0" width="520" height="1170" rx="16" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="28" y="42" font-size="26" fill="#eef2f8" text-anchor="start" font-weight="700">17  0/1 knapsack: sweep backward</text>
<text x="28" y="74" font-size="20" fill="#bec9da" text-anchor="start" font-weight="400">Algorithm traces · Worked example</text>
<line x1="28" y1="118" x2="492" y2="118" stroke="#8291aa" stroke-width="1"/>
<text x="28" y="155" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">0/1 items: (weight, value)</text>
<text x="28" y="190" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">A=(2, 3)  B=(3, 4)  capacity=4</text>
<text x="28" y="234" font-size="18" fill="#eef2f8" text-anchor="start" font-weight="400">Before any item; bottom labels are capacity.</text>
<rect x="57.0" y="258" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="92.0" y="289" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="332" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="258" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="176.0" y="289" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="332" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="258" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="260.0" y="289" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="260.0" y="332" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="258" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="344.0" y="289" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="344.0" y="332" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="258" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="428.0" y="289" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="428.0" y="332" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<text x="28" y="378" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">After A: sweep capacity 4 → 2</text>
<rect x="57.0" y="402" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="92.0" y="433" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="476" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="402" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="176.0" y="433" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="476" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="402" width="70" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="260.0" y="433" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="260.0" y="476" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="402" width="70" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="344.0" y="433" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="344.0" y="476" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="402" width="70" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="428.0" y="433" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">3</text>
<text x="428.0" y="476" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<line x1="428.0" y1="505" x2="260.0" y2="505" stroke="#9cbcff" stroke-width="2.5" marker-end="url(#knapsack-state-blue-arrow)"/>
<text x="28" y="545" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Read best[c-2] from previous items.</text>
<text x="28" y="605" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="700">After B: sweep capacity 4 → 3</text>
<rect x="57.0" y="629" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="92.0" y="660" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="92.0" y="703" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">0</text>
<rect x="141.0" y="629" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="176.0" y="660" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">0</text>
<text x="176.0" y="703" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">1</text>
<rect x="225.0" y="629" width="70" height="48" rx="8" fill="#111827" stroke="#8291aa" stroke-width="2"/>
<text x="260.0" y="660" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="400">3</text>
<text x="260.0" y="703" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">2</text>
<rect x="309.0" y="629" width="70" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="344.0" y="660" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">4</text>
<text x="344.0" y="703" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">3</text>
<rect x="393.0" y="629" width="70" height="48" rx="8" fill="#203455" stroke="#9cbcff" stroke-width="2"/>
<text x="428.0" y="660" font-size="20" fill="#eef2f8" text-anchor="middle" font-weight="700">4</text>
<text x="428.0" y="703" font-size="18" fill="#bec9da" text-anchor="middle" font-weight="400">4</text>
<line x1="428.0" y1="732" x2="344.0" y2="732" stroke="#9cbcff" stroke-width="2.5" marker-end="url(#knapsack-state-blue-arrow)"/>
<text x="28" y="774" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">best[4] = max(3, best[1]+4) = 4</text>
<rect x="28" y="815" width="464" height="108" rx="8" fill="#111827" stroke="#ffaaa1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="44" y="850" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="400">Ascending A would reuse the same item:</text>
<text x="44" y="887" font-size="20" fill="#ffaaa1" text-anchor="start" font-weight="400">best[4] = best[2] + 3 = 6 : invalid</text>
<rect x="28" y="965" width="464" height="136" rx="8" fill="#302a18" stroke="#f4cf70" stroke-width="2"/>
<text x="44" y="996" font-size="18" fill="#f4cf70" text-anchor="start" font-weight="700">KEY IDEA</text>
<text x="44" y="1025" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Descending capacity keeps the current</text>
<text x="44" y="1052" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">item out of its own predecessor states.</text>
<text x="44" y="1079" font-size="20" fill="#eef2f8" text-anchor="start" font-weight="400">Each item is used at most once.</text>
</svg>
