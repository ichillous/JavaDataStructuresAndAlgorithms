name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: ubuntu-latest
            java: '21'
          - os: windows-latest
            java: '21'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify tests, Javadoc, and coverage report
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Run packaged examples
        run: java -jar target/java-data-structures-and-algorithms-1.0.0-SNAPSHOT.jar
      - name: Run terminal lessons
        shell: bash
        run: |
          for topic in binary-search negative-edges range-queries lru; do
            java -jar target/java-data-structures-and-algorithms-1.0.0-SNAPSHOT.jar learn "$topic"
          done
      - name: Check local documentation links
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs.py
